name: Fast Deploy
on:
  push:
    branches: ["main"] # mainブランチにpushした瞬間に開始
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true # 新しいpushがあれば古いデプロイを即中止して次へ行く

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # 全ファイルをアップロード
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
