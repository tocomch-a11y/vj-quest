<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V39 - NEW GEOMETRY 10</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #arBtn { padding: 30px 50px; font-size: 20px; background: #fff; border-radius: 40px; cursor: pointer; border: none; font-weight: bold; z-index: 1000; }
    </style>
</head>
<body>
    <button id="arBtn">START NEW SESSION V39</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, mainGroup, xrRefSpace;
        let patterns = [];
        window.mD = { low: 0, mid: 0, high: 0 };
        let currentIdx = 0, nextSwitch = 0, hue = 0;

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { document.getElementById('audio').srcObject = s; });
        });

        function setup() {
            const geoms = [
                new THREE.IcosahedronGeometry(0.8, 2),      // 0: デジタル・プラネット
                new THREE.TorusKnotGeometry(0.5, 0.05, 128, 16, 5, 2), // 1: DNA螺旋の縺れ
                new THREE.BoxGeometry(0.05, 3, 0.05),       // 2: 垂直のレーザー・グリッド
                new THREE.TorusGeometry(0.6, 0.2, 4, 6),     // 3: 浮遊する六角形コア
                new THREE.LatheGeometry([new THREE.Vector2(0, -0.5), new THREE.Vector2(0.5, 0), new THREE.Vector2(0, 0.5)], 12), // 4: 幾何学の砂時計
                new THREE.SphereGeometry(1, 4, 2),          // 5: プリズム・シェル
                new THREE.TorusGeometry(1.2, 0.002, 16, 100),// 6: 極細のリング・オーラ
                new THREE.CylinderGeometry(0.1, 0.5, 0.5, 3),// 7: 浮遊ピラミッド
                new THREE.TorusKnotGeometry(0.7, 0.01, 256, 32, 2, 7), // 8: サイケデリック・スパイラル
                new THREE.PlaneGeometry(1, 1, 8, 8)          // 9: 空間に浮かぶタイルの欠片
            ];

            for(let i=0; i<10; i++) {
                const group = new THREE.Group();
                let count = (i === 2 || i === 9) ? 60 : 30;
                for(let j=0; j<count; j++) {
                    const m = new THREE.Mesh(geoms[i], new THREE.MeshBasicMaterial({ wireframe: true, transparent: true }));
                    m.position.set((Math.random()-0.5)*5, (Math.random()-0.5)*5, (Math.random()-0.5)*5);
                    m.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                    group.add(m);
                }
                group.visible = false;
                patterns.push(group);
                mainGroup.add(group);
            }
            patterns[0].visible = true;
        }

        async function start() {
            try {
                // エラー回避のため、requiredFeaturesを'local'のみに制限
                const session = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['local'] });
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
                renderer.xr.enabled = true;
                await renderer.xr.setSession(session);
                
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                mainGroup = new THREE.Group();
                scene.add(mainGroup);
                setup();

                xrRefSpace = await session.requestReferenceSpace('local');
                document.getElementById('audio').play().catch(()=>{});

                renderer.setAnimationLoop((t, frame) => {
                    if (!frame) return;
                    hue += 0.005;
                    if (Date.now() > nextSwitch) {
                        patterns[currentIdx].visible = false;
                        currentIdx = (currentIdx + 1) % 10;
                        patterns[currentIdx].visible = true;
                        nextSwitch = Date.now() + 6000;
                    }

                    const d = window.mD;
                    const target = new THREE.Vector3(0, 0, -2).applyQuaternion(camera.quaternion).add(camera.position);
                    mainGroup.position.lerp(target, 0.1);

                    patterns[currentIdx].children.forEach((p, i) => {
                        p.rotation.y += 0.01 + d.high;
                        p.scale.setScalar(0.7 + d.low * 2.5);
                        p.material.color.setHSL((hue + i/30)%1, 1, 0.5);
                        p.material.opacity = 0.3 + d.low * 0.7;

                        if(currentIdx === 2) p.rotation.z += d.mid * 0.2; // レーザーの回転
                        if(currentIdx === 9) p.position.z += Math.sin(t/1000 + i) * 0.01; // タイルの揺らぎ
                    });
                    renderer.render(scene, camera);
                });
            } catch (e) { alert("AR Launch Error: " + e.message); }
        }
        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
