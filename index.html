<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>QUEST V71 - DIRECT ANALYZE</title>
<style>body { margin: 0; background: #000; overflow: hidden; } #arBtn { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 30px; font-size: 20px; z-index: 1000; }</style>
</head>
<body>
    <button id="arBtn">START VR MODE V71</button>
    <audio id="remoteAudio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace, blockL, blockR, group;
        let audioCtx, analyser, dataArray;
        let currentRMS = 0;

        const peer = new Peer('quest-receiver');

        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => {
                // 音声解析のセットアップ
                if(!audioCtx) audioCtx = new AudioContext();
                const source = audioCtx.createMediaStreamSource(s);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                // 遅延補正（ビジュアルと合わせるためのディレイ）
                const delayNode = audioCtx.createDelay(1.0);
                delayNode.delayTime.value = 0.25; // ← ズレを感じたらここを調整！
                
                source.connect(analyser);
                analyser.connect(delayNode);
                delayNode.connect(audioCtx.destination);
                
                document.getElementById('remoteAudio').srcObject = s;
                document.getElementById('remoteAudio').muted = true; // スピーカーからはWebAudio経由で出すので、audioタグは消音
            });
        });

        async function start() {
            if(audioCtx) audioCtx.resume();
            const session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor'] });
            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            document.getElementById('arBtn').style.display = 'none';
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
            
            group = new THREE.Group();
            const geo = new THREE.BoxGeometry(0.1, 0.3, 0.1);
            blockL = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: 0x00ff00}));
            blockR = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: 0x00ff00}));
            group.add(blockL, blockR);
            scene.add(group);

            xrRefSpace = await session.requestReferenceSpace('local');
            await renderer.xr.setSession(session);

            renderer.setAnimationLoop((t, frame) => {
                if (!frame) return;

                // --- VRループ内で直接音量を計算 ---
                if (analyser) {
                    analyser.getByteTimeDomainData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        let v = (dataArray[i] - 128) / 128;
                        sum += v * v;
                    }
                    currentRMS = Math.sqrt(sum / dataArray.length);
                }

                const s = Math.min(1.0, currentRMS * 15.0);
                const head = camera.position;
                const q = camera.quaternion;
                group.position.copy(head).add(new THREE.Vector3(0, 0, -1.2).applyQuaternion(q));
                group.quaternion.copy(q);

                const gap = 0.5 * (1.0 - s);
                blockL.position.x = -gap;
                blockR.position.x = gap;

                // 反応チェック用の色変化
                blockL.material.color.set(s > 0.1 ? 0xffffff : 0x00ff00);
                blockR.material.color.set(s > 0.1 ? 0xffffff : 0x00ff00);

                renderer.render(scene, camera);
            });
        }
        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
