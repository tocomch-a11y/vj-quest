<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ULTIMATE PSY-AR V5 - HYPER SYNC</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 50px 80px; font-size: 32px; background: #000; color: #0f0; 
            border: 5px solid #0f0; border-radius: 40px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 100px #0f0; z-index: 1000;
        }
    </style>
</head>
<body>
    <button id="arBtn">SYNC SYSTEM</button>
    <audio id="audio" autoplay playsinline></audio>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <script>
        let scene, camera, renderer, xrRefSpace, mainGroup, parts = [];
        window.mD = { low: 0, mid: 0, high: 0, trigger: false };
        let lastSwitch = 0, hue = 0, vel = new THREE.Vector3();
        const audioElem = document.getElementById('audio');

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { audioElem.srcObject = s; });
        });

        function createPattern(index) {
            if (mainGroup) scene.remove(mainGroup);
            mainGroup = new THREE.Group();
            parts = [];
            const modes = [
                () => new THREE.TorusKnotGeometry(0.3, 0.1, 150, 20, 3, 7),
                () => new THREE.IcosahedronGeometry(0.5, 1),
                () => new THREE.TorusGeometry(0.4, 0.05, 16, 100),
                () => new THREE.OctahedronGeometry(0.5, 0),
                () => new THREE.BoxGeometry(0.5, 0.5, 0.5, 4, 4, 4)
            ];
            
            for(let i=0; i<15; i++){
                const geo = modes[index % modes.length]();
                const mat = new THREE.MeshBasicMaterial({
                    wireframe: true,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending
                });
                const m = new THREE.Mesh(geo, mat);
                m.rotation.set(Math.random()*7, Math.random()*7, Math.random()*7);
                parts.push(m);
                mainGroup.add(m);
            }
            scene.add(mainGroup);
        }

        async function startAR() {
            audioElem.play().catch(() => {});
            try {
                const session = await navigator.xr.requestSession('immersive-ar', {
                    optionalFeatures: ['local-floor', 'hand-tracking']
                });
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.xr.enabled = true;
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                createPattern(0);
                xrRefSpace = await session.requestReferenceSpace('viewer');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert(e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;
            const d = window.mD;
            hue += 0.005;

            if (d.trigger && (Date.now() - lastSwitch > 200)) {
                createPattern(Math.floor(Math.random()*10));
                lastSwitch = Date.now();
            }

            let rHand = null, lHandPos = null;
            const sources = frame.session.inputSources;
            for (let s of sources) {
                if (s.hand) {
                    const tip = s.hand.get('index-finger-tip');
                    const pose = tip ? frame.getJointPose(tip, xrRefSpace) : null;
                    if (pose) {
                        const v = new THREE.Vector3(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
                        if (s.handedness === 'right') rHand = v;
                        if (s.handedness === 'left') lHandPos = v;
                    }
                }
            }

            // 右手：磁力トラッキング。指先に吸い付くような物理挙動
            if (rHand) {
                let target = rHand.clone();
                let force = target.sub(mainGroup.position);
                vel.add(force.multiplyScalar(0.02)); 
                vel.multiplyScalar(0.88); // 慣性
                mainGroup.position.add(vel);
            } else {
                const gaze = new THREE.Vector3(0, 0, -0.6).applyQuaternion(camera.quaternion).add(camera.position);
                mainGroup.position.lerp(gaze, 0.05);
                vel.set(0,0,0);
            }

            // 左手の高さで彩度をマックスに
            const colorBoost = lHandPos ? Math.max(0, lHandPos.y * 2) : 1.0;

            parts.forEach((p, i) => {
                p.rotation.y += (0.02 + d.high * 4);
                p.rotation.z += (0.01 + d.mid * 2);
                
                // 音に完全同期するスケール
                const s = (0.3 + d.low * 8) * (1 + Math.sin(time*0.002 + i));
                p.scale.setScalar(s);

                // サイケデリック・マルチカラー
                const c = new THREE.Color();
                c.setHSL((hue + i/parts.length + d.mid) % 1, 0.9, 0.4 + d.low * 0.6);
                p.material.color = c;
                p.material.opacity = 0.4 + d.high * 0.6;
            });

            mainGroup.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        document.getElementById('arBtn').onclick = startAR;
    </script>
</body>
</html>
