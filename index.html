<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V24 - NEW EXPRESSIONS</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 30px 50px; font-size: 20px; background: #fff; color: #000; 
            border: none; border-radius: 40px; cursor: pointer; z-index: 1000;
        }
    </style>
</head>
<body>
    <button id="arBtn">START NEW VISUALS</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace, mainGroup;
        let patterns = [];
        window.mD = { low: 0, mid: 0, high: 0 }; // 音量データ
        let currentIdx = 0, nextSwitch = 0, hue = 0;
        const _v = new THREE.Vector3(), _color = new THREE.Color();

        // PeerJS セットアップ（前回同様、レンダリング開始前に接続準備）
        const peer = new Peer('quest-receiver');
        peer.on('connection', c => {
            c.on('data', d => {
                window.mD.low = d.low || 0;
                window.mD.mid = d.mid || 0;
                window.mD.high = d.high || 0;
            });
        });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => {
                const audio = document.getElementById('audio');
                audio.srcObject = s;
                audio.play().catch(e => console.log("Audio play deferred"));
            });
        });

        function setupPatterns() {
            for(let i=0; i<10; i++) { // 10種類の新パターン
                const group = new THREE.Group();
                let geo, count = 20;

                switch(i) {
                    case 0: // オーロラのような光の帯
                        geo = new THREE.PlaneGeometry(0.02, 1.5);
                        count = 30;
                        for(let j=0; j<count; j++) {
                            const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ wireframe: true, side: THREE.DoubleSide }));
                            m.position.set((Math.random()-0.5)*2, (Math.random()-0.5)*2, (Math.random()-0.5)*2);
                            m.rotation.x = Math.random() * Math.PI;
                            m.rotation.y = Math.random() * Math.PI;
                            group.add(m);
                        }
                        break;
                    case 1: // データグリッドが歪む
                        geo = new THREE.PlaneGeometry(0.1, 0.1, 2, 2);
                        count = 50;
                        for(let j=0; j<count; j++) {
                            const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ wireframe: true }));
                            m.position.set((Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5);
                            group.add(m);
                        }
                        break;
                    case 2: // 宇宙空間を流れる粒子ストリーム
                        geo = new THREE.SphereGeometry(0.01, 4, 2);
                        count = 100;
                        for(let j=0; j<count; j++) {
                            const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ wireframe: true }));
                            m.position.set((Math.random()-0.5)*3, (Math.random()-0.5)*3, (Math.random()-0.5)*3);
                            group.add(m);
                        }
                        break;
                    case 3: // 無限に続く多角形トンネル
                        geo = new THREE.RingGeometry(0.3, 0.35, 6, 1);
                        count = 15;
                        for(let j=0; j<count; j++) {
                            const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ wireframe: true, side: THREE.DoubleSide }));
                            m.position.z = -j * 0.8;
                            group.add(m);
                        }
                        break;
                    case 4: // サイバーキューブが回転・分裂
                        geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                        count = 8;
                        for(let j=0; j<count; j++) {
                            const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ wireframe: true }));
                            m.position.setFromSphericalCoords(0.8, Math.random()*Math.PI, Math.random()*Math.PI*2);
                            group.add(m);
                        }
                        break;
                    case 5: // 光るデジタルの雨
                        geo = new THREE.BoxGeometry(0.01, 0.3, 0.01);
                        count = 50;
                        for(let j=0; j<count; j++) {
                            const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ wireframe: true }));
                            m.position.set((Math.random()-0.5)*2, Math.random()*3, (Math.random()-0.5)*2);
                            group.add(m);
                        }
                        break;
                    case 6: // プロジェクションマッピングのような図形
                        geo = new THREE.DodecahedronGeometry(0.3);
                        count = 3;
                        for(let j=0; j<count; j++) {
                            const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ wireframe: true }));
                            m.position.setFromSphericalCoords(0.7 + j*0.2, Math.random()*Math.PI, Math.random()*Math.PI*2);
                            group.add(m);
                        }
                        break;
                    case 7: // 音で振動するワイヤーフレームの波
                        geo = new THREE.TorusGeometry(0.3, 0.01, 4, 32);
                        count = 20;
                        for(let j=0; j<count; j++) {
                            const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ wireframe: true }));
                            m.position.set(0, 0, -j * 0.3);
                            m.rotation.x = Math.PI / 2;
                            group.add(m);
                        }
                        break;
                    case 8: // ピクセルアートのような巨大スフィア
                        geo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
                        count = 50;
                        for(let j=0; j<count; j++) {
                            const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ wireframe: true }));
                            _v.setFromSphericalCoords(1.2, Math.random()*Math.PI, Math.random()*Math.PI*2);
                            m.position.copy(_v);
                            group.add(m);
                        }
                        break;
                    case 9: // 空間を貫くレーザーグリッド
                        geo = new THREE.BoxGeometry(2.0, 0.005, 0.005);
                        count = 10;
                        for(let j=0; j<count; j++) {
                            const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ wireframe: true }));
                            m.position.set((Math.random()-0.5)*1, (Math.random()-0.5)*1, (Math.random()-0.5)*1);
                            m.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                            group.add(m);
                        }
                        break;
                }
                group.visible = false;
                patterns.push(group);
                mainGroup.add(group);
            }
            if (patterns.length > 0) patterns[0].visible = true;
        }

        async function startARSession() {
            // 音声のアクティベート（重要：ボタンクリック直後に行う）
            const audio = document.getElementById('audio');
            audio.play().catch(() => {});

            try {
                const session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor'] }); // hand-trackingを削除
                renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
                renderer.xr.enabled = true;
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                mainGroup = new THREE.Group();
                scene.add(mainGroup);
                
                setupPatterns(); // パターンセットアップ
                xrRefSpace = await session.requestReferenceSpace('local');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert("XR Error: " + e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return; // レンダリング準備ができていなければ何もしない

            const d = window.mD;
            hue += 0.001; // 色の変化を非常にゆっくりに

            // パターン切り替え
            if (Date.now() > nextSwitch) {
                if(patterns[currentIdx]) patterns[currentIdx].visible = false;
                currentIdx = (currentIdx + 1) % patterns.length;
                if(patterns[currentIdx]) patterns[currentIdx].visible = true;
                nextSwitch = Date.now() + 4000; // 4秒で切り替え
            }

            // オブジェクト位置は常にカメラ正面（ハンドトラッキング無効化）
            _v.set(0, 0, -1.0).applyQuaternion(camera.quaternion).add(camera.position); // カメラの少し前
            mainGroup.position.lerp(_v, 0.1);

            // 各パターン要素のアニメーション
            const activeGroup = patterns[currentIdx];
            if (activeGroup) {
                activeGroup.children.forEach((p, i) => {
                    p.rotation.y += 0.005 + d.mid * 0.5; // 中音域で回転
                    p.rotation.x += 0.003 + d.high * 0.3; // 高音域で回転

                    // 低音域でスケール変化（全体的に控えめに）
                    const baseScale = 0.8;
                    const scaleEffect = d.low * 0.15; // 以前よりさらに控えめ
                    p.scale.setScalar(baseScale + scaleEffect);
                    
                    // 色変化
                    _color.setHSL((hue + i/activeGroup.children.length)%1, 0.9, 0.6);
                    p.material.color.copy(_color);
                    p.material.opacity = 0.8 + d.low * 0.2; // 低音で少し透過

                    // 個別アニメーション（例：トンネルの移動）
                    if (currentIdx === 3) {
                        p.position.z += 0.03 + d.low * 0.05;
                        if(p.position.z > 1.0) p.position.z = -10.0;
                    }
                     // デジタルの雨が降る
                    if (currentIdx === 5) {
                        p.position.y -= 0.05 + d.low * 0.1;
                        if(p.position.y < -1.5) p.position.y = 1.5;
                    }
                });
            }

            renderer.render(scene, camera);
        }
        document.getElementById('arBtn').onclick = startARSession;
    </script>
</body>
</html>
