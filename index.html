<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V12 - STABLE 20</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 40px 60px; font-size: 28px; background: #fff; color: #000; 
            border: none; border-radius: 60px; font-weight: bold; cursor: pointer;
            z-index: 1000; box-shadow: 0 0 30px #fff;
        }
    </style>
</head>
<body>
    <button id="arBtn">START STABLE SESSION</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace, mainGroup;
        let patternGroups = []; // 20種類のグループを保持
        window.mD = { low: 0, mid: 0, high: 0, trigger: false };
        let nextAutoSwitch = 0, hue = 0, currentIdx = 0;
        let lHandPos = new THREE.Vector3(), rHandPos = new THREE.Vector3();
        let lActive = false, rActive = false;

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { document.getElementById('audio').srcObject = s; });
        });

        // 20種類の形状を事前に全て生成（フリーズ防止）
        function setupPatterns() {
            const geometries = [
                new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.SphereGeometry(0.2, 8, 8),
                new THREE.TorusGeometry(0.3, 0.05, 12, 24), new THREE.OctahedronGeometry(0.3),
                new THREE.CylinderGeometry(0, 0.2, 0.5, 4), new THREE.IcosahedronGeometry(0.3, 0),
                new THREE.TorusKnotGeometry(0.2, 0.06, 64, 8), new THREE.DodecahedronGeometry(0.3),
                new THREE.TetrahedronGeometry(0.4), new THREE.RingGeometry(0.1, 0.4, 6),
                new THREE.CapsuleGeometry(0.1, 0.2, 4, 8), new THREE.TorusGeometry(0.3, 0.1, 3, 3),
                new THREE.BoxGeometry(0.02, 0.8, 0.02), new THREE.PlaneGeometry(0.4, 0.4),
                new THREE.TorusKnotGeometry(0.2, 0.02, 100, 16, 3, 5), new THREE.ConeGeometry(0.2, 0.5, 4),
                new THREE.TorusGeometry(0.4, 0.02, 4, 100), new THREE.BoxGeometry(0.4, 0.05, 0.4),
                new THREE.OctahedronGeometry(0.4, 2), new THREE.TorusKnotGeometry(0.1, 0.08, 32, 4)
            ];

            geometries.forEach((geo, idx) => {
                const group = new THREE.Group();
                for(let i=0; i<15; i++) {
                    const mat = new THREE.MeshBasicMaterial({ wireframe: true, transparent: true, blending: THREE.AdditiveBlending });
                    const m = new THREE.Mesh(geo, mat);
                    m.position.set((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5);
                    m.rotation.set(Math.random()*7, Math.random()*7, Math.random()*7);
                    group.add(m);
                }
                group.visible = false;
                patternGroups.push(group);
                mainGroup.add(group);
            });
            patternGroups[0].visible = true;
        }

        async function startAR() {
            try {
                const session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor', 'hand-tracking'] });
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.xr.enabled = true;
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                mainGroup = new THREE.Group();
                scene.add(mainGroup);
                
                setupPatterns();
                xrRefSpace = await session.requestReferenceSpace('local');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert(e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;
            const d = window.mD;
            hue += 0.005;

            // パターン切替（2秒ごと）
            if (Date.now() > nextAutoSwitch) {
                patternGroups[currentIdx].visible = false;
                currentIdx = (currentIdx + 1) % 20;
                patternGroups[currentIdx].visible = true;
                nextAutoSwitch = Date.now() + 2500;
            }

            // トラッキング強化：コントローラーではなく「手」を厳密に取得
            lActive = false; rActive = false;
            for (let s of frame.session.inputSources) {
                if (s.hand) {
                    const joint = s.hand.get('wrist') || s.hand.get('middle-finger-metacarpal');
                    const pose = frame.getJointPose(joint, xrRefSpace);
                    if (pose) {
                        const p = pose.transform.position;
                        if (s.handedness === 'left') { lHandPos.set(p.x, p.y, p.z); lActive = true; }
                        if (s.handedness === 'right') { rHandPos.set(p.x, p.y, p.z); rActive = true; }
                    }
                }
            }

            // 位置計算
            const headFront = new THREE.Vector3(0, 0, -0.6).applyQuaternion(camera.quaternion).add(camera.position);
            let targetPos = headFront;
            if (lActive && rActive) targetPos = lHandPos.clone().lerp(rHandPos, 0.5);
            else if (rActive) targetPos = rHandPos;
            else if (lActive) targetPos = lHandPos;
            mainGroup.position.lerp(targetPos, 0.2);

            // 演出（表示中のグループのみ更新）
            patternGroups[currentIdx].children.forEach((p, i) => {
                p.rotation.y += 0.02 + d.high * 5;
                p.rotation.x += 0.01 + d.mid * 2;
                
                const color = new THREE.Color().setHSL((hue + i/15)%1, 1, 0.5);
                p.material.color = color;
                p.material.opacity = 0.3 + d.low * 0.7;
                p.scale.setScalar(0.2 + d.low * 2.0);

                if (lActive && rActive) {
                    const dH = lHandPos.distanceTo(rHandPos);
                    p.position.setLength(0.1 + dH * 0.5);
                }
            });

            renderer.render(scene, camera);
        }
        document.getElementById('arBtn').onclick = startAR;
    </script>
</body>
</html>
