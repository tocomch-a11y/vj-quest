<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V59 - RECOVERY</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 30px; font-size: 20px; font-weight: bold;
            background: #00ff00; color: #000; border: none; cursor: pointer; z-index: 1000;
        }
    </style>
</head>
<body>
    <button id="arBtn">START SYNC V59 (RECOVERY)</button>
    <audio id="remoteAudio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace, mainGroup;
        let audioCtx, delayNode, streamSource;
        let remoteStream = null;
        let blockL, blockR;
        window.mD = { low: 0, mid: 0, high: 0 };

        const peer = new Peer('quest-receiver');

        peer.on('connection', c => {
            c.on('data', d => { if(d) window.mD = d; });
        });

        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { 
                remoteStream = s;
                // audioタグに流し込む
                const audioEl = document.getElementById('remoteAudio');
                audioEl.srcObject = s;
                // WebAudio(ディレイ調整用)に接続
                if (audioCtx) connectStream(s);
            });
        });

        function connectStream(stream) {
            // 既存の接続を解除
            if (streamSource) streamSource.disconnect();
            
            // AudioContextが停止していたら再開
            if (audioCtx.state === 'suspended') audioCtx.resume();

            streamSource = audioCtx.createMediaStreamSource(stream);
            
            if (!delayNode) {
                delayNode = audioCtx.createDelay(1.0);
                delayNode.delayTime.value = 0.25; // ここで遅延調整
                delayNode.connect(audioCtx.destination);
            }
            streamSource.connect(delayNode);
        }

        function setupVisuals() {
            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            const geo = new THREE.BoxGeometry(0.1, 0.3, 0.1);
            blockL = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: 0x00ff00}));
            blockR = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: 0x00ff00}));
            mainGroup.add(blockL, blockR);
            
            // センターライン
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.5, 0.01), new THREE.MeshBasicMaterial({color: 0xffffff}));
            mainGroup.add(line);
        }

        async function start() {
            try {
                // 1. AudioContextをユーザー操作直後に作成
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();

                // 2. XRセッション開始
                const session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor'] });
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.xr.enabled = true;
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';
                
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                
                setupVisuals();

                // すでにストリームが届いていれば接続
                if (remoteStream) connectStream(remoteStream);

                xrRefSpace = await session.requestReferenceSpace('local');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert(e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;

            // カメラの前に追従
            const head = camera.position;
            const rot = camera.quaternion;
            mainGroup.position.copy(head).add(new THREE.Vector3(0, 0, -1.2).applyQuaternion(rot));
            mainGroup.quaternion.copy(rot);

            // V59の動き: low(低域)に合わせてブロックが衝突
            const impact = window.mD.low || 0;
            const gap = 0.4 * (1.0 - Math.min(1.0, impact * 1.5));
            blockL.position.x = -gap;
            blockR.position.x = gap;

            // 色の変化
            if (impact > 0.5) {
                blockL.material.color.set(0xffffff);
                blockR.material.color.set(0xffffff);
            } else {
                blockL.material.color.set(0x00ff00);
                blockR.material.color.set(0x00ff00);
            }

            renderer.render(scene, camera);
        }

        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
