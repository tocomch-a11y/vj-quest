<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V32 - BOOT FIX</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #arBtn { 
            padding: 40px 80px; font-size: 28px; font-weight: bold;
            background: #00ff00; color: #000; border: none; border-radius: 60px; 
            cursor: pointer; box-shadow: 0 0 40px rgba(0,255,0,0.8);
            transition: 0.2s;
        }
        #arBtn:active { transform: scale(0.95); opacity: 0.8; }
        #msg { position: fixed; bottom: 40px; text-align: center; width: 100%; font-family: monospace; color: #0f0; }
    </style>
</head>
<body>
    <button id="arBtn">START AR</button>
    <div id="msg">READY</div>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace, mainGroup;
        let patterns = [];
        window.mD = { low: 0, mid: 0, high: 0 };
        let currentIdx = 0, nextSwitch = 0, hue = 0;
        const msg = document.getElementById('msg');

        // --- 最小限のPeerJS (AR起動後に呼び出す) ---
        function startNetwork() {
            const peer = new Peer('quest-receiver');
            peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
            peer.on('call', call => {
                call.answer(new MediaStream());
                call.on('stream', s => { document.getElementById('audio').srcObject = s; });
            });
            msg.innerText = "NETWORK ACTIVE";
        }

        function setupPatterns() {
            const geoms = [
                new THREE.OctahedronGeometry(0.5, 2), new THREE.TorusKnotGeometry(0.4, 0.08, 6, 3),
                new THREE.CylinderGeometry(0.01, 0.01, 2, 8), new THREE.SphereGeometry(0.5, 4, 4),
                new THREE.PlaneGeometry(0.3, 0.3), new THREE.TorusGeometry(0.6, 0.02, 16, 3),
                new THREE.IcosahedronGeometry(1.2, 1), new THREE.BoxGeometry(0.02, 0.02, 0.02),
                new THREE.RingGeometry(0.3, 0.7, 4), new THREE.CapsuleGeometry(0.05, 0.5, 4, 8)
            ];
            for(let i=0; i<10; i++) {
                const g = new THREE.Group();
                for(let j=0; j<40; j++) {
                    const m = new THREE.Mesh(geoms[i], new THREE.MeshBasicMaterial({ wireframe: true, transparent: true, opacity: 0.5 }));
                    m.position.set((Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*4);
                    g.add(m);
                }
                g.visible = false;
                patterns.push(g);
                mainGroup.add(g);
            }
            patterns[0].visible = true;
        }

        async function initAR() {
            msg.innerText = "REQUESTING...";
            if (!navigator.xr) { alert("WebXR not supported"); return; }

            try {
                // セッション開始（余計なオプションを削り、成功率を最大化）
                const session = await navigator.xr.requestSession('immersive-ar');
                
                renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
                renderer.xr.enabled = true;
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                mainGroup = new THREE.Group();
                scene.add(mainGroup);
                
                setupPatterns();
                
                xrRefSpace = await session.requestReferenceSpace('local');
                await renderer.xr.setSession(session);
                
                // AR起動後にネットワークと音声を解禁
                startNetwork();
                document.getElementById('audio').play().catch(()=>{});

                renderer.setAnimationLoop((t, frame) => {
                    if (!frame) return;
                    hue += 0.005;
                    if (Date.now() > nextSwitch) {
                        patterns[currentIdx].visible = false;
                        currentIdx = (currentIdx + 1) % 10;
                        patterns[currentIdx].visible = true;
                        nextSwitch = Date.now() + 6000;
                    }
                    const d = window.mD;
                    patterns[currentIdx].children.forEach((p, i) => {
                        p.rotation.y += 0.01 + d.high;
                        p.scale.setScalar(0.7 + d.low * 2);
                        p.material.color.setHSL((hue + i/40)%1, 1, 0.5);
                    });
                    renderer.render(scene, camera);
                });
            } catch (e) {
                msg.innerText = "ERROR: " + e.message;
                console.error(e);
            }
        }

        document.getElementById('arBtn').onclick = initAR;
    </script>
</body>
</html>
