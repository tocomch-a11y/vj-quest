<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR QUEST V4 - STABLE</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; font-family: sans-serif; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 40px 60px; font-size: 28px; background: #00ff00; color: #000; 
            border: none; border-radius: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 30px rgba(0,255,0,0.5); z-index: 1000;
        }
    </style>
</head>
<body>
    <button id="arBtn">START VR VJ</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, mesh, xrRefSpace, geometries = [];
        window.mD = { low: 0, mid: 0, high: 0, trigger: false };
        let lastSwitch = 0, hue = 0;
        const audioElem = document.getElementById('audio');
        
        // PeerJSの設定（受信待機）
        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { 
            console.log("Mac Connected");
            c.on('data', d => { window.mD = d; }); 
        });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { audioElem.srcObject = s; });
        });

        // 形状12種類の初期化（エラー回避済み版）
        function initGeos() {
            geometries = [
                new THREE.TorusKnotGeometry(0.3, 0.1, 128, 16, 2, 3),
                new THREE.IcosahedronGeometry(0.4, 0),
                new THREE.TorusGeometry(0.4, 0.15, 16, 100),
                new THREE.OctahedronGeometry(0.5, 0),
                new THREE.DodecahedronGeometry(0.4, 0),
                new THREE.SphereGeometry(0.4, 32, 32),
                new THREE.BoxGeometry(0.5, 0.5, 0.5),
                new THREE.TorusKnotGeometry(0.3, 0.05, 150, 20, 7, 11),
                new THREE.CylinderGeometry(0.2, 0.5, 0.8, 32),
                new THREE.ConeGeometry(0.4, 0.8, 32),
                new THREE.TorusGeometry(0.3, 0.2, 32, 100),
                new THREE.TorusKnotGeometry(0.3, 0.1, 64, 8, 3, 4) // エラー回避のための代替形状
            ];
        }

        async function startAR() {
            // 音声再生のトリガー
            audioElem.play().catch(() => {});
            
            try {
                // ARセッションの開始
                const session = await navigator.xr.requestSession('immersive-ar', {
                    optionalFeatures: ['local-floor', 'hand-tracking']
                });
                
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.xr.enabled = true;
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
                
                initGeos();
                const mat = new THREE.MeshBasicMaterial({ wireframe: true, color: 0x00ff00 });
                mesh = new THREE.Mesh(geometries[0], mat);
                scene.add(mesh);

                xrRefSpace = await session.requestReferenceSpace('viewer');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);

            } catch (e) {
                alert("AR Start Error: " + e.message);
            }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;
            const d = window.mD;
            hue += 0.005;

            // 1. 低音トリガーで形状チェンジ（250ミリ秒のクールタイム）
            if (d.trigger && (Date.now() - lastSwitch > 250)) {
                mesh.geometry = geometries[Math.floor(Math.random() * geometries.length)];
                lastSwitch = Date.now();
            }

            // 2. ハンドトラッキング判定
            let handPos = null;
            const inputSources = frame.session.inputSources;
            for (let i = 0; i < inputSources.length; i++) {
                const input = inputSources[i];
                if (input.hand) {
                    // 人差し指の先端(index-finger-tip)を取得
                    const joint = input.hand.get('index-finger-tip');
                    const pose = joint ? frame.getJointPose(joint, xrRefSpace) : null;
                    if (pose) {
                        handPos = new THREE.Vector3(
                            pose.transform.position.x,
                            pose.transform.position.y,
                            pose.transform.position.z
                        );
                    }
                }
            }

            // 3. 位置の決定（手があれば手へ、なければ視線の正面へ）
            if (handPos) {
                mesh.position.lerp(handPos, 0.2); // 手にスムーズに吸い付く
            } else {
                // 視線の先（正面0.7mの位置）を計算
                const gaze = new THREE.Vector3(0, 0, -0.7).applyQuaternion(camera.quaternion).add(camera.position);
                mesh.position.lerp(gaze, 0.1); // 視線に合わせてふわっと移動
            }

            // 4. 音連動のアニメーション
            mesh.rotation.y += 0.02 + (d.high * 2.5); // 高音で高速回転
            mesh.rotation.x += 0.01 + (d.mid * 1.5);  // 中音で縦回転
            mesh.scale.setScalar(0.3 + (d.low * 10.0)); // 低音で巨大化（感度アップ）

            // 5. 色の変化（中音に合わせて虹色がシフト）
            mesh.material.color.setHSL((hue + d.mid) % 1, 1, 0.5);

            renderer.render(scene, camera);
        }

        document.getElementById('arBtn').onclick = startAR;
    </script>
</body>
</html>
