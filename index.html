<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V35 - BARE METAL</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #btn { padding: 40px; font-size: 24px; font-weight: bold; background: #fff; border-radius: 20px; cursor: pointer; border: none; }
    </style>
</head>
<body>
    <button id="btn">TEST AR LAUNCH</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, mainGroup;
        let patterns = [];
        let currentIdx = 0, hue = 0, nextSwitch = 0;

        function setup() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            const geoms = [
                new THREE.TorusKnotGeometry(0.5, 0.02, 100, 16),
                new THREE.BoxGeometry(0.01, 0.01, 5),
                new THREE.PlaneGeometry(2, 2, 10, 10),
                new THREE.IcosahedronGeometry(0.5, 0),
                new THREE.TorusGeometry(0.7, 0.1, 12, 48)
            ];

            for(let i=0; i<5; i++) {
                const g = new THREE.Group();
                for(let j=0; j<20; j++) {
                    const m = new THREE.Mesh(geoms[i], new THREE.MeshBasicMaterial({ wireframe: true, color: 0x00ff00 }));
                    m.position.set((Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*4);
                    g.add(m);
                }
                g.visible = false;
                patterns.push(g);
                mainGroup.add(g);
            }
            patterns[0].visible = true;
        }

        async function launch() {
            try {
                // 最優先：XRセッションの確保
                const session = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['local']
                });

                // セッションが通ってから描画系を初期化
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
                renderer.xr.enabled = true;
                await renderer.xr.setSession(session);
                
                document.body.appendChild(renderer.domElement);
                document.getElementById('btn').style.display = 'none';

                setup();

                renderer.setAnimationLoop(() => {
                    hue += 0.005;
                    if (Date.now() > nextSwitch) {
                        patterns[currentIdx].visible = false;
                        currentIdx = (currentIdx + 1) % 5;
                        patterns[currentIdx].visible = true;
                        nextSwitch = Date.now() + 5000;
                    }
                    
                    const target = new THREE.Vector3(0, 0, -2).applyQuaternion(camera.quaternion).add(camera.position);
                    mainGroup.position.lerp(target, 0.1);

                    patterns[currentIdx].children.forEach((p, i) => {
                        p.rotation.y += 0.02;
                        p.material.color.setHSL((hue + i/20)%1, 1, 0.5);
                    });
                    renderer.render(scene, camera);
                });

            } catch (e) {
                alert("Critical Launch Error: " + e.message);
                console.error(e);
            }
        }

        document.getElementById('btn').onclick = launch;
    </script>
</body>
</html>
