<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V41 - FINAL STABLE</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #arBtn { padding: 35px 55px; font-size: 22px; background: #00ff00; color: #000; border-radius: 50px; cursor: pointer; border: none; font-weight: bold; z-index: 1000; box-shadow: 0 0 20px #0f0; }
    </style>
</head>
<body>
    <button id="arBtn">START AR SESSION V41</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, mainGroup, xrSession;
        let patterns = [];
        window.mD = { low: 0, mid: 0, high: 0 };
        let currentIdx = 0, nextSwitch = 0, hue = 0;

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { document.getElementById('audio').srcObject = s; });
        });

        function setup() {
            const geoms = [
                new THREE.TorusKnotGeometry(0.6, 0.01, 150, 20), // 0
                new THREE.OctahedronGeometry(1, 0),             // 1
                new THREE.TorusGeometry(0.8, 0.2, 4, 4),        // 2
                new THREE.BoxGeometry(2, 2, 0.01),              // 3
                new THREE.IcosahedronGeometry(0.5, 4),          // 4
                new THREE.CylinderGeometry(0.01, 0.01, 5, 8),   // 5
                new THREE.TorusGeometry(0.6, 0.2, 16, 100),     // 6
                new THREE.TetrahedronGeometry(0.5, 0),          // 7
                new THREE.TorusKnotGeometry(0.5, 0.1, 64, 8),   // 8
                new THREE.SphereGeometry(1.2, 12, 6)            // 9
            ];

            for(let i=0; i<10; i++) {
                const g = new THREE.Group();
                for(let j=0; j<25; j++) {
                    const m = new THREE.Mesh(geoms[i], new THREE.MeshBasicMaterial({ wireframe: true, transparent: true }));
                    m.position.set((Math.random()-0.5)*4.5, (Math.random()-0.5)*4.5, (Math.random()-0.5)*4.5);
                    g.add(m);
                }
                g.visible = false;
                patterns.push(g);
                mainGroup.add(g);
            }
            patterns[0].visible = true;
        }

        async function start() {
            // エラーを避けるため、既存セッションがあれば終了
            if (xrSession) { try { await xrSession.end(); } catch(e){} }

            try {
                xrSession = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['local'] });
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
                renderer.xr.enabled = true;
                await renderer.xr.setSession(xrSession);
                
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                mainGroup = new THREE.Group();
                scene.add(mainGroup);
                setup();

                document.getElementById('audio').play().catch(()=>{});

                renderer.setAnimationLoop((t, frame) => {
                    if (!frame) return;
                    hue += 0.005;
                    if (Date.now() > nextSwitch) {
                        patterns[currentIdx].visible = false;
                        currentIdx = (currentIdx + 1) % 10;
                        patterns[currentIdx].visible = true;
                        nextSwitch = Date.now() + 6000;
                    }

                    const d = window.mD;
                    const target = new THREE.Vector3(0, 0, -2).applyQuaternion(camera.quaternion).add(camera.position);
                    mainGroup.position.lerp(target, 0.1);

                    patterns[currentIdx].children.forEach((p, i) => {
                        p.rotation.y += 0.01 + d.high;
                        p.scale.setScalar(0.7 + d.low * 2.5);
                        p.material.color.setHSL((hue + i/25)%1, 1, 0.5);
                    });
                    renderer.render(scene, camera);
                });
            } catch (e) { alert("AR Error: " + e.message); }
        }
        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
