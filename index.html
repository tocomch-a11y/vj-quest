<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V46 - HYPER EVOLUTION</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 35px 60px; font-size: 24px; font-weight: bold;
            background: #fff; color: #000; border: none; border-radius: 50px; 
            cursor: pointer; z-index: 1000; box-shadow: 0 0 30px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <button id="arBtn">START EVOLUTION V46</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace, mainGroup;
        let patterns = [];
        window.mD = { low: 0, mid: 0, high: 0 };
        let currentIdx = 0, nextSwitch = 0, hue = 0;
        const _v = new THREE.Vector3(), _color = new THREE.Color();

        // V28の安定した通信コード
        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { document.getElementById('audio').srcObject = s; });
        });

        function setup() {
            // V46 新10種：数理的・空間的な重なりを重視した新デザイン
            const geoms = [
                new THREE.TorusKnotGeometry(0.5, 0.005, 200, 20, 3, 5), // 0: デジタル・ナーヴ（神経）
                new THREE.IcosahedronGeometry(0.8, 1),                 // 1: データの胞子
                new THREE.TorusGeometry(0.7, 0.25, 3, 3),              // 2: デルタ・チューブ
                new THREE.BoxGeometry(0.01, 3, 0.01),                  // 3: 垂直の光柱（レーザー）
                new THREE.DodecahedronGeometry(0.6, 0),                // 4: 多面体の核
                new THREE.TorusGeometry(1.0, 0.002, 8, 100),           // 5: 虚空のリング（極細）
                new THREE.OctahedronGeometry(0.5, 4),                  // 6: フラクタル・ダイヤモンド
                new THREE.CylinderGeometry(0.1, 0.4, 0.4, 4),          // 7: 浮遊ピラミッド
                new THREE.TorusKnotGeometry(0.4, 0.12, 100, 12, 2, 3), // 8: 重なり合う龍
                new THREE.SphereGeometry(1.5, 12, 12)                  // 9: デジタル・グリッド球体
            ];

            for(let i=0; i<10; i++) {
                const group = new THREE.Group();
                let count = (i === 3 || i === 9) ? 50 : 25; // 特定のパターンは密度を上げる
                for(let j=0; j<count; j++) {
                    const m = new THREE.Mesh(geoms[i], new THREE.MeshBasicMaterial({ wireframe: true, transparent: true }));
                    m.position.set((Math.random()-0.5)*4.5, (Math.random()-0.5)*4.5, (Math.random()-0.5)*4.5);
                    m.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                    group.add(m);
                }
                group.visible = false;
                patterns.push(group);
                mainGroup.add(group);
            }
            patterns[0].visible = true;
        }

        async function start() {
            document.getElementById('audio').play().catch(() => {});
            try {
                // V28で成功していた「local-floor」設定
                const session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor'] });
                renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
                renderer.xr.enabled = true;
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                mainGroup = new THREE.Group();
                scene.add(mainGroup);
                setup();

                xrRefSpace = await session.requestReferenceSpace('local');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert("AR Error: " + e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;
            const d = window.mD;
            hue += 0.005;

            // 6秒ごとに自動切り替え
            if (Date.now() > nextSwitch) {
                patterns[currentIdx].visible = false;
                currentIdx = (currentIdx + 1) % 10;
                patterns[currentIdx].visible = true;
                nextSwitch = Date.now() + 6000;
            }

            // V28の安定した追従ロジック
            _v.set(0, 0, -1.8).applyQuaternion(camera.quaternion).add(camera.position);
            mainGroup.position.lerp(_v, 0.1);

            patterns[currentIdx].children.forEach((p, i) => {
                // 音への反応
                p.rotation.y += 0.01 + d.high;
                p.rotation.z += 0.005 + d.mid;
                p.scale.setScalar(0.7 + d.low * 2.3);

                // カラーアニメーション
                _color.setHSL((hue + i/25)%1, 1, 0.5);
                p.material.color.copy(_color);
                p.material.opacity = 0.3 + d.low * 0.7;

                // 3番（レーザー）だけの特殊挙動
                if(currentIdx === 3) {
                    p.rotation.x = Math.PI / 2;
                    p.position.y += Math.sin(time/500 + i) * 0.01;
                }
            });
            renderer.render(scene, camera);
        }
        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
