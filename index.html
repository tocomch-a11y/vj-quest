<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V62 - SMOOTH SYNC</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 30px; font-size: 20px; font-weight: bold; background: #00ff00; border: none; z-index: 1000;
        }
        #valDisplay {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            color: #0f0; background: rgba(0,0,0,0.8); padding: 10px; font-family: monospace;
        }
    </style>
</head>
<body>
    <button id="arBtn">START SMOOTH TEST V62</button>
    <div id="valDisplay">LATENCY: <span id="latVal">0.25</span>s</div>
    <audio id="remoteAudio" autoplay playsinline muted></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace;
        let audioCtx, delayNode, streamSource;
        let remoteStream = null;
        let group, blockL, blockR, bar;
        
        // --- 調整用：ここを変更 ---
        let currentDelay = 0.25; 
        // -----------------------

        window.mD = { rms: 0, beat: 0, low: 0 };

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => {
            c.on('data', d => { if(d) for(let k in window.mD) window.mD[k]=d[k]; });
        });

        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { 
                remoteStream = s;
                document.getElementById('remoteAudio').srcObject = s;
                if (audioCtx) connectStream(s);
            });
        });

        function connectStream(stream) {
            if (streamSource) streamSource.disconnect();
            audioCtx.resume();
            streamSource = audioCtx.createMediaStreamSource(stream);
            if (!delayNode) {
                delayNode = audioCtx.createDelay(1.0);
                delayNode.delayTime.value = currentDelay; 
                delayNode.connect(audioCtx.destination);
            }
            streamSource.connect(delayNode);
        }

        function setup() {
            group = new THREE.Group();
            scene.add(group);

            // 背景バー
            bar = new THREE.Mesh(
                new THREE.PlaneGeometry(1.2, 0.02),
                new THREE.MeshBasicMaterial({color: 0x333333})
            );
            group.add(bar);

            // 衝突ブロック（縦長のバーに変更して視認性UP）
            const geo = new THREE.BoxGeometry(0.04, 0.4, 0.04);
            blockL = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: 0x00ff00}));
            blockR = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: 0x00ff00}));
            group.add(blockL);
            group.add(blockR);

            // センター判定ライン
            const center = new THREE.Mesh(
                new THREE.BoxGeometry(0.01, 0.5, 0.01),
                new THREE.MeshBasicMaterial({color: 0xffffff})
            );
            group.add(center);
        }

        async function start() {
            document.getElementById('latVal').innerText = currentDelay;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor'] });
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.xr.enabled = true;
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                setup();
                if (remoteStream) connectStream(remoteStream);
                xrRefSpace = await session.requestReferenceSpace('local');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert(e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;
            const d = window.mD;

            // カメラの前に固定（カクつき防止のため補間を弱めるか、固定値を計算）
            const head = camera.position;
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            group.position.copy(head).add(dir.multiplyScalar(1.0));
            group.quaternion.copy(camera.quaternion);

            // --- スムーズな衝突アニメーション ---
            // rms(音量)をベースに、0.0〜1.0の範囲でブロックを移動
            // 音が大きくなるほど x が 0 に近づく（衝突）
            const targetX = 0.5 * Math.max(0, 1.0 - (d.rms * 5.0)); 
            
            // 線形補間(lerp)を使用して動きを滑らかに
            blockL.position.x = THREE.MathUtils.lerp(blockL.position.x, -targetX, 0.3);
            blockR.position.x = THREE.MathUtils.lerp(blockR.position.x, targetX, 0.3);

            // 衝突の瞬間（ピッのピーク）に色を白く光らせる
            const flash = d.rms > 0.15 ? 1 : 0;
            if(flash) {
                blockL.material.color.set(0xffffff);
                blockR.material.color.set(0xffffff);
            } else {
                blockL.material.color.set(0x00ff00);
                blockR.material.color.set(0x00ff00);
            }

            renderer.render(scene, camera);
        }
        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
