<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ULTIMATE PSY-AR V6</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; font-family: sans-serif; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 40px 60px; font-size: 28px; background: #000; color: #ff00ff; 
            border: 4px solid #ff00ff; border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 30px #ff00ff; z-index: 1000;
        }
    </style>
</head>
<body>
    <button id="arBtn">START SESSION</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace, mainGroup, parts = [];
        window.mD = { low: 0, mid: 0, high: 0, trigger: false };
        let lastSwitch = 0, hue = 0, vel = new THREE.Vector3();
        const audioElem = document.getElementById('audio');

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { audioElem.srcObject = s; });
        });

        function createPattern(index) {
            if (mainGroup) scene.remove(mainGroup);
            mainGroup = new THREE.Group();
            parts = [];
            const modes = [
                () => new THREE.TorusKnotGeometry(0.3, 0.08, 128, 16, 3, 4),
                () => new THREE.IcosahedronGeometry(0.4, 1),
                () => new THREE.TorusGeometry(0.4, 0.1, 16, 100),
                () => new THREE.OctahedronGeometry(0.5, 0),
                () => new THREE.SphereGeometry(0.4, 16, 16)
            ];
            
            for(let i=0; i<12; i++){
                const mat = new THREE.MeshBasicMaterial({
                    wireframe: true,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending
                });
                const m = new THREE.Mesh(modes[index % modes.length](), mat);
                m.rotation.set(Math.random()*7, Math.random()*7, Math.random()*7);
                parts.push(m);
                mainGroup.add(m);
            }
            scene.add(mainGroup);
        }

        async function startAR() {
            audioElem.play().catch(() => {});
            try {
                const session = await navigator.xr.requestSession('immersive-ar', {
                    optionalFeatures: ['local-floor', 'hand-tracking']
                });
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.xr.enabled = true;
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                
                createPattern(0);
                xrRefSpace = await session.requestReferenceSpace('local'); // local空間に変更して安定化
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert(e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;
            const d = window.mD;
            hue += 0.003;

            // 低音トリガーでパターン切替
            if (d.trigger && (Date.now() - lastSwitch > 250)) {
                createPattern(Math.floor(Math.random()*10));
                lastSwitch = Date.now();
            }

            // ハンドトラッキング（右手）
            let rHand = null;
            const sources = frame.session.inputSources;
            for (let s of sources) {
                if (s.hand && s.handedness === 'right') {
                    const tip = s.hand.get('index-finger-tip');
                    const pose = tip ? frame.getJointPose(tip, xrRefSpace) : null;
                    if (pose) rHand = new THREE.Vector3(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
                }
            }

            // 3. 位置の決定：常にカメラの正面（目の前）に維持する
            if (rHand) {
                // 右手がある場合は手に吸いつく
                let diff = rHand.clone().sub(mainGroup.position);
                vel.add(diff.multiplyScalar(0.05));
                vel.multiplyScalar(0.8);
                mainGroup.position.add(vel);
            } else {
                // 手がない場合は、常にカメラの0.6m正面に配置
                const direction = new THREE.Vector3(0, 0, -0.6); // 目の前60cm
                direction.applyQuaternion(camera.quaternion);
                const targetPos = camera.position.clone().add(direction);
                mainGroup.position.lerp(targetPos, 0.1);
            }

            // ビジュアル更新
            parts.forEach((p, i) => {
                p.rotation.y += (0.01 + d.high * 3);
                p.rotation.x += d.mid * 1;
                
                // スケール：低音に反応
                const s = (0.3 + d.low * 6) * (1 + Math.sin(time*0.001 + i) * 0.2);
                p.scale.setScalar(s);

                // 【修正】色が白くならないように、明るさ（L）を0.5固定にする
                const pColor = new THREE.Color();
                // 色相(H)は時間と中音、彩度(S)は0.9、輝度(L)は0.5（これで白飛びを防ぐ）
                pColor.setHSL((hue + i/parts.length + d.mid * 0.5) % 1, 0.9, 0.5);
                p.material.color = pColor;
                // 透明度を低音で変化させて躍動感を出す
                p.material.opacity = 0.5 + d.low * 0.5;
            });

            renderer.render(scene, camera);
        }
        document.getElementById('arBtn').onclick = startAR;
    </script>
</body>
</html>
