<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V61 - PRECISION SYNC</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 30px; font-size: 20px; font-weight: bold;
            background: #00ff00; color: #000; border: none; cursor: pointer; z-index: 1000;
        }
        #valDisplay {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            color: #0f0; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #0f0;
            font-size: 24px; pointer-events: none;
        }
    </style>
</head>
<body>
    <button id="arBtn">START SYNC TEST V61</button>
    <div id="valDisplay">LATENCY: <span id="latVal">0.25</span>s</div>
    <audio id="remoteAudio" autoplay playsinline muted></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace, mainGroup;
        let audioCtx, delayNode, streamSource;
        let remoteStream = null;
        let blockL, blockR, centerLine, flashMesh;
        
        // 調整用変数
        let currentDelay = 0.25; 

        window.mD = { low:0, rms:0, beat:0 };

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => {
            c.on('data', d => { if(d) for(let k in window.mD) window.mD[k]=d[k]; });
        });

        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { 
                remoteStream = s;
                document.getElementById('remoteAudio').srcObject = s;
                if (audioCtx) connectStream(s);
            });
        });

        function connectStream(stream) {
            if (streamSource) streamSource.disconnect();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            streamSource = audioCtx.createMediaStreamSource(stream);
            if (!delayNode) {
                delayNode = audioCtx.createDelay(1.0);
                delayNode.delayTime.value = currentDelay; 
                delayNode.connect(audioCtx.destination);
            }
            streamSource.connect(delayNode);
        }

        function setup() {
            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            // 1. 中央の判定ライン
            const lineGeo = new THREE.BoxGeometry(0.01, 0.8, 0.01);
            centerLine = new THREE.Mesh(lineGeo, new THREE.MeshBasicMaterial({color: 0xffffff}));
            mainGroup.add(centerLine);

            // 2. 左右の衝突ブロック
            const blockGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            blockL = new THREE.Mesh(blockGeo, new THREE.MeshBasicMaterial({color: 0xff0000}));
            blockR = new THREE.Mesh(blockGeo, new THREE.MeshBasicMaterial({color: 0xff0000}));
            mainGroup.add(blockL);
            mainGroup.add(blockR);

            // 3. 背景のフラッシュ面
            const flashGeo = new THREE.PlaneGeometry(2, 2);
            flashMesh = new THREE.Mesh(flashGeo, new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0}));
            flashMesh.position.z = -0.1;
            mainGroup.add(flashMesh);
        }

        async function start() {
            document.getElementById('latVal').innerText = currentDelay;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor'] });
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.xr.enabled = true; renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                setup();
                if (remoteStream) connectStream(remoteStream);
                xrRefSpace = await session.requestReferenceSpace('local');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert(e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;
            const d = window.mD;

            const targetPos = new THREE.Vector3(0, 0, -1.2).applyQuaternion(camera.quaternion).add(camera.position);
            mainGroup.position.lerp(targetPos, 0.2);
            mainGroup.lookAt(camera.position);

            // --- 同期ロジック ---
            // 拍(beat)や低域(low)に反応して、ブロックが中央へ「衝突」する
            // 戻る動きはゆっくり、叩く動きは鋭く
            const impact = Math.pow(d.beat, 0.5) || Math.pow(d.low, 0.5); 
            
            // ブロックの位置計算 (0で衝突)
            const offsetX = 0.4 * (1.0 - impact);
            blockL.position.set(-offsetX, 0, 0);
            blockR.position.set(offsetX, 0, 0);

            // 衝突した瞬間に色を変える
            if (impact > 0.8) {
                blockL.material.color.setHex(0xffffff);
                blockR.material.color.setHex(0xffffff);
                flashMesh.material.opacity = d.rms * 0.5;
            } else {
                blockL.material.color.setHex(0xff0000);
                blockR.material.color.setHex(0xff0000);
                flashMesh.material.opacity *= 0.8;
            }

            // 正報(ポーン)などの長い音は中央ラインの高さで表現
            centerLine.scale.y = 1.0 + d.rms * 2.0;

            renderer.render(scene, camera);
        }
        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
