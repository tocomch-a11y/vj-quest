<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>QUEST - PSY-AR</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        #arBtn { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 50px; font-size: 24px; background: #0f0; border-radius: 20px; font-weight: bold; z-index: 999; }
    </style>
</head>
<body>
    <button id="arBtn">START AR</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, mesh, xrRefSpace, geometries = [];
        window.mD = { low: 0, mid: 0, high: 0, trigger: false };
        let lastSwitch = 0, hue = 0;

        // PeerJSの準備を「ボタンを押す前」に開始する（重要！）
        const peer = new Peer('quest-receiver');
        
        peer.on('open', (id) => { console.log('Quest ID: ' + id); });
        peer.on('connection', c => {
            console.log("Mac connected!");
            c.on('data', d => { window.mD = d; });
        });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => {
                const a = document.getElementById('audio');
                a.srcObject = s;
                a.play().catch(e => console.error("Audio error", e));
            });
        });

        function initGeos() {
            for(let i=0; i<12; i++) {
                geometries.push(new THREE.TorusKnotGeometry(0.3, 0.08, 64, 12, i+1, i+3));
            }
        }

        async function startAR() {
            // 音声再生の「予約」
            document.getElementById('audio').play().catch(() => {});
            
            try {
                const session = await navigator.xr.requestSession('immersive-ar', {
                    optionalFeatures: ['local-floor', 'hand-tracking']
                });
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
                renderer.xr.enabled = true;
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera();
                initGeos();
                mesh = new THREE.Mesh(geometries[0], new THREE.MeshBasicMaterial({ wireframe: true, color: 0x00ff00 }));
                scene.add(mesh);

                xrRefSpace = await session.requestReferenceSpace('viewer');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert(e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace) return;
            const d = window.mD;
            hue += 0.01;
            if (d.trigger && (Date.now() - lastSwitch > 300)) {
                mesh.geometry = geometries[Math.floor(Math.random() * 12)];
                lastSwitch = Date.now();
            }
            const gaze = new THREE.Vector3(0, 0, -0.6).applyQuaternion(camera.quaternion).add(camera.position);
            mesh.position.lerp(gaze, 0.1);
            mesh.rotation.y += 0.02 + (d.high * 1.5);
            mesh.scale.setScalar(0.4 + (d.low * 6)); // 低音への反応を強めた
            mesh.material.color.setHSL((hue + d.mid) % 1, 1, 0.5);
            renderer.render(scene, camera);
        }
        document.getElementById('arBtn').onclick = startAR;
    </script>
</body>
</html>
