<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V17 - LIGHT STABLE</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 30px 50px; font-size: 18px; background: #fff; color: #000; 
            border: none; border-radius: 40px; font-weight: bold; cursor: pointer; z-index: 1000;
        }
    </style>
</head>
<body>
    <button id="arBtn">START SYSTEM</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        // 1. 基本設定と再利用変数の定義
        let scene, camera, renderer, xrRefSpace, mainGroup;
        let patterns = [];
        window.mD = { low: 0, mid: 0, high: 0, trigger: false };
        let currentIdx = 0, nextSwitch = 0, hue = 0;
        const _v = new THREE.Vector3();
        const _color = new THREE.Color();

        // 2. PeerJS 通信の最小化
        const peer = new Peer('quest-receiver');
        peer.on('connection', c => {
            c.on('data', d => { 
                window.mD.low = d.low; 
                window.mD.mid = d.mid; 
                window.mD.high = d.high;
            });
        });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { document.getElementById('audio').srcObject = s; });
        });

        // 3. 8パターンの超軽量セットアップ
        function setup() {
            const geos = [
                new THREE.BoxGeometry(0.1, 0.1, 0.1),
                new THREE.IcosahedronGeometry(0.12, 0),
                new THREE.TorusGeometry(0.5, 0.01, 8, 12), // Warp 1
                new THREE.TorusGeometry(0.8, 0.005, 6, 16), // Warp 2
                new THREE.BoxGeometry(0.05, 0.05, 0.05), // Invader 1
                new THREE.BoxGeometry(0.03, 0.03, 0.03), // Invader 2
                new THREE.BoxGeometry(0.002, 0.002, 1), // Digital 1
                new THREE.SphereGeometry(0.02, 4, 3) // Digital 2
            ];

            for(let i=0; i<8; i++) {
                const group = new THREE.Group();
                const count = i < 2 ? 10 : (i < 4 ? 6 : (i < 6 ? 15 : 20));
                for(let j=0; j<count; j++) {
                    const mat = new THREE.MeshBasicMaterial({ wireframe: true });
                    const m = new THREE.Mesh(geos[i], mat);
                    
                    // パターンごとの配置
                    if(i < 2) m.position.setFromSphericalCoords(0.7, Math.random()*3, Math.random()*6);
                    else if(i < 4) m.position.z = -j * 0.8;
                    else m.position.set((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5));
                    
                    group.add(m);
                }
                group.visible = false;
                patterns.push(group);
                mainGroup.add(group);
            }
            patterns[0].visible = true;
        }

        async function start() {
            try {
                const session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor', 'hand-tracking'] });
                renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
                renderer.setPixelRatio(1); // 解像度を固定して負荷軽減
                renderer.xr.enabled = true;
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                mainGroup = new THREE.Group();
                scene.add(mainGroup);
                
                setup();
                xrRefSpace = await session.requestReferenceSpace('local');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { console.error(e); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;
            const d = window.mD;
            hue += 0.005;

            // 周期切替
            if (Date.now() > nextSwitch) {
                patterns[currentIdx].visible = false;
                currentIdx = (currentIdx + 1) % 8;
                patterns[currentIdx].visible = true;
                nextSwitch = Date.now() + 4000;
            }

            // ハンドトラッキング（最も負荷の低い方法）
            let hand = null;
            for (const input of frame.session.inputSources) {
                if (input.hand) {
                    const wrist = input.hand.get('wrist');
                    const pose = frame.getJointPose(wrist, xrRefSpace);
                    if (pose) {
                        hand = pose.transform.position;
                        break;
                    }
                }
            }

            // 位置追従
            _v.set(0, 0, -0.6).applyQuaternion(camera.quaternion).add(camera.position);
            if(hand) mainGroup.position.lerp(_v.set(hand.x, hand.y, hand.z), 0.1);
            else mainGroup.position.lerp(_v, 0.1);

            // アニメーション
            patterns[currentIdx].children.forEach((p, i) => {
                p.rotation.y += 0.02 + d.high * 1.5;
                p.scale.setScalar(0.5 + d.low * 0.3); // 振幅をさらに抑制
                
                _color.setHSL((hue + i/10)%1, 0.8, 0.5);
                p.material.color.copy(_color);

                if (currentIdx === 2 || currentIdx === 3) { // Warp move
                    p.position.z += 0.01 + d.low * 0.05;
                    if(p.position.z > 0.5) p.position.z = -4;
                }
            });

            renderer.render(scene, camera);
        }
        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
