<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V40 - ULTIMATE GEOMETRY</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #arBtn { padding: 30px 50px; font-size: 20px; background: #fff; border-radius: 40px; cursor: pointer; border: none; font-weight: bold; z-index: 1000; }
    </style>
</head>
<body>
    <button id="arBtn">START SESSION V40</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, mainGroup, xrRefSpace;
        let patterns = [];
        window.mD = { low: 0, mid: 0, high: 0 };
        let currentIdx = 0, nextSwitch = 0, hue = 0;

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { document.getElementById('audio').srcObject = s; });
        });

        function setup() {
            // 新・幾何学10種 (V40エディション)
            const geoms = [
                new THREE.TorusKnotGeometry(0.6, 0.005, 200, 16, 3, 4), // 0: デジタル・シルク
                new THREE.OctahedronGeometry(1.2, 0),                 // 1: 虚空のダイヤモンド
                new THREE.TorusGeometry(0.8, 0.2, 3, 3),              // 2: 浮遊するピラミッド・リング
                new THREE.BoxGeometry(2, 2, 0.01),                    // 3: 空間のスライス・パネル
                new THREE.IcosahedronGeometry(0.5, 5),                // 4: 幾何学の星雲
                new THREE.CylinderGeometry(0.01, 0.01, 5, 8),         // 5: 無限の垂直線
                new THREE.TorusGeometry(0.5, 0.3, 16, 100),           // 6: サイケデリック・ドーナツ
                new THREE.TetrahedronGeometry(0.4, 0),                // 7: 浮遊する四面体
                new THREE.TorusKnotGeometry(0.5, 0.1, 64, 8, 2, 5),   // 8: 重なり合う龍の尾
                new THREE.SphereGeometry(1, 16, 8)                    // 9: デジタル・ケージ
            ];

            for(let i=0; i<10; i++) {
                const group = new THREE.Group();
                let count = (i === 3 || i === 5) ? 40 : 25;
                for(let j=0; j<count; j++) {
                    const m = new THREE.Mesh(geoms[i], new THREE.MeshBasicMaterial({ wireframe: true, transparent: true }));
                    m.position.set((Math.random()-0.5)*5, (Math.random()-0.5)*5, (Math.random()-0.5)*5);
                    m.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                    group.add(m);
                }
                group.visible = false;
                patterns.push(group);
                mainGroup.add(group);
            }
            patterns[0].visible = true;
        }

        async function start() {
            try {
                // エラーの主因である local-floor を排除し、最も安全な local を使用
                const session = await navigator.xr.requestSession('immersive-ar', { 
                    requiredFeatures: ['local'] 
                });
                
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
                renderer.xr.enabled = true;
                await renderer.xr.setSession(session);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                mainGroup = new THREE.Group();
                scene.add(mainGroup);
                setup();

                xrRefSpace = await session.requestReferenceSpace('local');
                document.getElementById('audio').play().catch(()=>{});

                renderer.setAnimationLoop((t, frame) => {
                    if (!frame) return;
                    hue += 0.005;
                    if (Date.now() > nextSwitch) {
                        patterns[currentIdx].visible = false;
                        currentIdx = (currentIdx + 1) % 10;
                        patterns[currentIdx].visible = true;
                        nextSwitch = Date.now() + 6000;
                    }

                    const d = window.mD;
                    const target = new THREE.Vector3(0, 0, -2).applyQuaternion(camera.quaternion).add(camera.position);
                    mainGroup.position.lerp(target, 0.1);

                    patterns[currentIdx].children.forEach((p, i) => {
                        p.rotation.y += 0.01 + d.high;
                        p.scale.setScalar(0.7 + d.low * 2.3);
                        p.material.color.setHSL((hue + i/25)%1, 1, 0.5);
                        p.material.opacity = 0.3 + d.low * 0.7;

                        if(currentIdx === 5) p.rotation.z += d.mid * 0.1; // 垂直線のスピン
                    });
                    renderer.render(scene, camera);
                });
            } catch (e) { alert("AR Error: " + e.message); }
        }
        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
