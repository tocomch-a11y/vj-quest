<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ULTIMATE PSY-AR VJ 2026</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 50px 80px; font-size: 32px; background: linear-gradient(45deg, #f0f, #0ff); color: #fff; 
            border: none; border-radius: 40px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 100px #f0f; z-index: 1000; text-transform: uppercase;
        }
    </style>
</head>
<body>
    <button id="arBtn">AWAKEN SYSTEM</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace;
        let mainGroup, parts = [];
        window.mD = { low: 0, mid: 0, high: 0, trigger: false };
        let lastSwitch = 0, hue = 0;
        let vel = new THREE.Vector3(); // 加速度シミュレーション
        const audioElem = document.getElementById('audio');

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { audioElem.srcObject = s; });
        });

        function createPattern(index) {
            if (mainGroup) scene.remove(mainGroup);
            mainGroup = new THREE.Group();
            parts = [];
            const colors = [0xff0044, 0x00ffcc, 0x0044ff, 0xffcc00, 0xff00ff, 0x00ffff];

            switch(index % 12) {
                case 0: // 爆発するDNA
                    for(let i=0; i<60; i++){
                        const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.05, 0), new THREE.MeshBasicMaterial({color: colors[i%6]}));
                        m.position.y = (i - 30) * 0.03;
                        parts.push(m); mainGroup.add(m);
                    }
                    break;
                case 1: // ネオン・マトリックス
                    const g = new THREE.BoxGeometry(0.6, 0.6, 0.6, 4, 4, 4);
                    const mat = new THREE.MeshBasicMaterial({color: 0x00ff00, wireframe: true});
                    const m1 = new THREE.Mesh(g, mat);
                    parts.push(m1); mainGroup.add(m1);
                    break;
                case 2: // 反重力リング
                    for(let i=0; i<15; i++){
                        const r = new THREE.Mesh(new THREE.TorusGeometry(0.1 + i*0.05, 0.01, 8, 50), new THREE.MeshBasicMaterial({color: colors[i%6]}));
                        parts.push(r); mainGroup.add(r);
                    }
                    break;
                case 3: // サイケデリック・スパイラル
                    const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(0.4, 0.02, 200, 32, 15, 11), new THREE.MeshBasicMaterial({color: 0xff00ff, wireframe:true}));
                    parts.push(knot); mainGroup.add(knot);
                    break;
                case 4: // フラクタル・ピラミッド
                    for(let i=0; i<8; i++){
                        const t = new THREE.Mesh(new THREE.TetrahedronGeometry(0.4 - i*0.05), new THREE.MeshBasicMaterial({color: colors[i%6], wireframe:true}));
                        parts.push(t); mainGroup.add(t);
                    }
                    break;
                case 5: // 超次元キューブ
                    for(let i=0; i<4; i++){
                        const b = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshBasicMaterial({color: colors[i], wireframe:true}));
                        b.rotation.x = i; parts.push(b); mainGroup.add(b);
                    }
                    break;
                case 6: // プラズマ・スフィア
                    const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshBasicMaterial({color: 0x00ffff, wireframe:true}));
                    const s2 = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({color: 0xff00ff}));
                    parts.push(s1, s2); mainGroup.add(s1, s2);
                    break;
                case 7: // ヴォイド・スター
                    for(let i=0; i<30; i++){
                        const l = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 1), new THREE.MeshBasicMaterial({color: colors[i%6]}));
                        l.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                        parts.push(l); mainGroup.add(l);
                    }
                    break;
                case 8: // サイバー・ギア
                    const g1 = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.1, 16, 6), new THREE.MeshBasicMaterial({color: 0xffff00, wireframe:true}));
                    parts.push(g1); mainGroup.add(g1);
                    break;
                case 9: // 重なり合う次元
                    for(let i=0; i<10; i++){
                        const p = new THREE.Mesh(new THREE.CircleGeometry(0.5, 6), new THREE.MeshBasicMaterial({color: colors[i%6], side: THREE.DoubleSide, wireframe:true}));
                        p.position.z = i * 0.05; parts.push(p); mainGroup.add(p);
                    }
                    break;
                case 10: // 浮遊する破片
                    for(let i=0; i<20; i++){
                        const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.1), new THREE.MeshBasicMaterial({color: colors[i%6]}));
                        m.position.set(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5);
                        parts.push(m); mainGroup.add(m);
                    }
                    break;
                case 11: // 神聖幾何学
                    const geoF = new THREE.IcosahedronGeometry(0.5, 1);
                    const matF = new THREE.MeshBasicMaterial({color: 0xffffff, wireframe: true});
                    const f1 = new THREE.Mesh(geoF, matF);
                    parts.push(f1); mainGroup.add(f1);
                    break;
            }
            scene.add(mainGroup);
        }

        async function startAR() {
            audioElem.play().catch(() => {});
            try {
                const session = await navigator.xr.requestSession('immersive-ar', {
                    optionalFeatures: ['local-floor', 'hand-tracking']
                });
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.xr.enabled = true;
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                
                createPattern(0);
                xrRefSpace = await session.requestReferenceSpace('viewer');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert(e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;
            const d = window.mD;
            hue += 0.003;

            if (d.trigger && (Date.now() - lastSwitch > 200)) {
                createPattern(Math.floor(Math.random()*12));
                lastSwitch = Date.now();
            }

            let rHand = null, lHand = null;
            const sources = frame.session.inputSources;
            for (let s of sources) {
                if (s.hand) {
                    const tip = s.hand.get('index-finger-tip');
                    const pose = tip ? frame.getJointPose(tip, xrRefSpace) : null;
                    if (pose) {
                        const v = new THREE.Vector3(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
                        if (s.handedness === 'right') rHand = v;
                        if (s.handedness === 'left') lHand = v;
                    }
                }
            }

            // 右手：重力源。物体を「引き寄せる」
            if (rHand) {
                let target = rHand.clone();
                let diff = target.sub(mainGroup.position);
                vel.add(diff.multiplyScalar(0.01)); // 加速度を足す
                vel.multiplyScalar(0.92); // 摩擦
                mainGroup.position.add(vel);
            } else {
                const gaze = new THREE.Vector3(0, 0, -0.7).applyQuaternion(camera.quaternion).add(camera.position);
                mainGroup.position.lerp(gaze, 0.05);
                vel.set(0,0,0);
            }

            // 左手：空間歪曲（高さでエフェクト強度、距離で分散）
            const warpFactor = lHand ? (lHand.y * 5) : 1;
            const spreadFactor = lHand ? Math.abs(lHand.x - mainGroup.position.x) * 10 : 1;

            // 視線の傾き
            const roll = new THREE.Euler().setFromQuaternion(camera.quaternion).z;

            parts.forEach((p, i) => {
                // パーツごとの個別挙動：音と左手の連動
                p.rotation.y += (0.02 + d.high * 3) * (i % 2 === 0 ? 1 : -1);
                p.rotation.x += d.mid * 2;
                
                // ダイナミックなスケール変化
                const s = (0.2 + d.low * 6) * warpFactor;
                p.scale.setScalar(s);

                // 左手が近いほどパーツが飛び散る
                if(lHand) {
                    p.position.x += Math.sin(time*0.005 + i) * 0.01 * spreadFactor;
                    p.position.y += Math.cos(time*0.005 + i) * 0.01 * spreadFactor;
                }

                // 爆烈マルチカラー
                const pColor = new THREE.Color();
                const pID = (i + Math.floor(hue * 10)) % 6;
                // 低音で発光、中音で色相、高音で明滅
                pColor.setHSL((hue + i/parts.length + d.mid) % 1, 0.9, 0.3 + d.low * 0.7);
                if (p.material) {
                    p.material.color = pColor;
                    p.material.opacity = 0.5 + d.high * 0.5;
                    p.material.transparent = true;
                }
            });

            // メイングループ自体の激しい回転
            mainGroup.rotation.y += 0.01 + d.mid * 0.1;
            mainGroup.rotation.z = roll * 2;

            renderer.render(scene, camera);
        }
        document.getElementById('arBtn').onclick = startAR;
    </script>
</body>
</html>
