<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V43 - BYPASS</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #arBtn { 
            padding: 40px 60px; font-size: 24px; font-weight: bold;
            background: #0000ff; color: #fff; border: none; border-radius: 60px; 
            cursor: pointer; box-shadow: 0 0 30px #0000ff;
        }
    </style>
</head>
<body>
    <button id="arBtn">BYPASS START AR</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, mainGroup;
        let patterns = [];
        window.mD = { low: 0, mid: 0, high: 0 };
        let currentIdx = 0, nextSwitch = 0, hue = 0;

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { document.getElementById('audio').srcObject = s; });
        });

        function setup() {
            const geoms = [
                new THREE.TorusKnotGeometry(0.5, 0.01, 128, 16),
                new THREE.OctahedronGeometry(1, 0),
                new THREE.TorusGeometry(0.7, 0.2, 4, 4),
                new THREE.BoxGeometry(2, 2, 0.02),
                new THREE.IcosahedronGeometry(0.5, 2),
                new THREE.CylinderGeometry(0.01, 0.01, 4, 6),
                new THREE.TorusGeometry(0.6, 0.15, 12, 48),
                new THREE.TetrahedronGeometry(0.6, 0),
                new THREE.TorusKnotGeometry(0.4, 0.08, 64, 8),
                new THREE.SphereGeometry(1, 8, 4)
            ];
            for(let i=0; i<10; i++) {
                const g = new THREE.Group();
                for(let j=0; j<25; j++) {
                    const m = new THREE.Mesh(geoms[i], new THREE.MeshBasicMaterial({ wireframe: true }));
                    m.position.set((Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*4);
                    g.add(m);
                }
                g.visible = false;
                patterns.push(g);
                mainGroup.add(g);
            }
            patterns[0].visible = true;
        }

        async function start() {
            try {
                // セッション開始（オプション無しで最短要求）
                const session = await navigator.xr.requestSession('immersive-ar');
                
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
                renderer.xr.enabled = true;
                await renderer.xr.setSession(session);
                
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                mainGroup = new THREE.Group();
                scene.add(mainGroup);
                setup();

                // 【最重要】エラーが出やすい箇所をtry-catchで無視する
                try {
                    await session.requestReferenceSpace('local');
                } catch(refError) {
                    console.warn("ReferenceSpace failed but continuing...");
                    // 失敗しても、viewer（頭の動き）さえ取れれば描画はできる可能性があります
                    try { await session.requestReferenceSpace('viewer'); } catch(e) {}
                }

                document.getElementById('audio').play().catch(()=>{});

                renderer.setAnimationLoop((t, frame) => {
                    if (!frame) return;
                    hue += 0.005;
                    if (Date.now() > nextSwitch) {
                        patterns[currentIdx].visible = false;
                        currentIdx = (currentIdx + 1) % 10;
                        patterns[currentIdx].visible = true;
                        nextSwitch = Date.now() + 6000;
                    }

                    const d = window.mD;
                    // 頭の動きに合わせて追従
                    const target = new THREE.Vector3(0, 0, -1.8).applyQuaternion(camera.quaternion).add(camera.position);
                    mainGroup.position.lerp(target, 0.1);

                    patterns[currentIdx].children.forEach((p, i) => {
                        p.rotation.y += 0.01 + d.high;
                        p.scale.setScalar(0.7 + d.low * 2);
                        p.material.color.setHSL((hue + i/25)%1, 1, 0.5);
                    });
                    renderer.render(scene, camera);
                });
            } catch (e) {
                alert("FORCE START FAILED: " + e.message);
            }
        }
        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
