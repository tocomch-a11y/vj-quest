<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V33 - 5 SELECT</title>
    <style>
        body { margin: 0; background: #000; color: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        #arBtn { 
            padding: 30px 60px; font-size: 24px; font-weight: bold; background: #fff; color: #000; 
            border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px #fff;
        }
    </style>
</head>
<body>
    <button id="arBtn">START AR</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrSession, mainGroup;
        let patterns = [];
        window.mD = { low: 0, mid: 0, high: 0 };
        let currentIdx = 0, nextSwitch = 0, hue = 0;

        // --- Network ---
        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { document.getElementById('audio').srcObject = s; });
        });

        function setup() {
            const geoms = [
                new THREE.TorusKnotGeometry(0.5, 0.01, 150, 20), // 0: データの縺れ
                new THREE.BoxGeometry(0.01, 0.01, 5),          // 1: 高速ワープ
                new THREE.PlaneGeometry(3, 3, 15, 15),         // 2: グリッド膜
                new THREE.IcosahedronGeometry(0.4, 0),         // 3: 浮遊結晶
                new THREE.TorusGeometry(0.8, 0.2, 4, 4)        // 4: 幾何学リング
            ];
            for(let i=0; i<5; i++) {
                const g = new THREE.Group();
                const count = (i===1) ? 50 : 15;
                for(let j=0; j<count; j++) {
                    const m = new THREE.Mesh(geoms[i], new THREE.MeshBasicMaterial({ wireframe: true, transparent: true, opacity: 0.6 }));
                    if(i===1) m.position.set((Math.random()-0.5)*3, (Math.random()-0.5)*3, -Math.random()*5);
                    else m.position.set((Math.random()-0.5)*3, (Math.random()-0.5)*3, (Math.random()-0.5)*3);
                    g.add(m);
                }
                g.visible = false;
                patterns.push(g);
                mainGroup.add(g);
            }
            patterns[0].visible = true;
        }

        async function activateAR() {
            if (!navigator.xr) return alert("WebXR NOT SUPPORTED");
            
            try {
                // セッション要求を最小限に
                xrSession = await navigator.xr.requestSession('immersive-ar');
                
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
                renderer.xr.enabled = true;
                await renderer.xr.setSession(xrSession);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                mainGroup = new THREE.Group();
                scene.add(mainGroup);
                
                setup();
                document.getElementById('audio').play().catch(()=>{});

                renderer.setAnimationLoop((t, frame) => {
                    if (!frame) return;
                    hue += 0.005;
                    if (Date.now() > nextSwitch) {
                        patterns[currentIdx].visible = false;
                        currentIdx = (currentIdx + 1) % 5;
                        patterns[currentIdx].visible = true;
                        nextSwitch = Date.now() + 6000;
                    }

                    const d = window.mD;
                    const targetPos = new THREE.Vector3(0, 0, -1.5).applyQuaternion(camera.quaternion).add(camera.position);
                    mainGroup.position.lerp(targetPos, 0.1);

                    patterns[currentIdx].children.forEach((p, i) => {
                        p.rotation.y += 0.01 + d.high;
                        p.scale.setScalar(0.7 + d.low * 2);
                        p.material.color.setHSL((hue + i/20)%1, 1, 0.5);
                        
                        if(currentIdx === 1) { // Warp effect
                            p.position.z += 0.05 + d.low*0.2;
                            if(p.position.z > 1) p.position.z = -5;
                        }
                    });
                    renderer.render(scene, camera);
                });
            } catch (e) {
                alert("AR ERROR: " + e.message);
            }
        }

        document.getElementById('arBtn').onclick = activateAR;
    </script>
</body>
</html>
