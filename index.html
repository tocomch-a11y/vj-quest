<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>PSY-AR V75</title>
<style>body { margin: 0; background: #000; overflow: hidden; } #arBtn { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 30px; font-size: 20px; z-index: 1000; background: #00ff00; }</style>
</head>
<body>
    <button id="arBtn">START SYNC V75</button>
    <audio id="remoteAudio" autoplay playsinline muted></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <script>
        let scene, camera, renderer, xrRefSpace, blockL, blockR, mainGroup;
        let audioCtx, delayNode, streamSource;
        window.mD = { low: 0, mid: 0 };

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => {
            c.on('data', d => { if(d) window.mD = d; });
        });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { 
                document.getElementById('remoteAudio').srcObject = s;
                if (audioCtx) connectAudio(s);
            });
        });

        function connectAudio(stream) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (streamSource) streamSource.disconnect();
            streamSource = audioCtx.createMediaStreamSource(stream);
            delayNode = audioCtx.createDelay(1.0);
            delayNode.delayTime.value = 0.25; // ズレ調整
            streamSource.connect(delayNode);
            delayNode.connect(audioCtx.destination); // ここだけで音を出す
        }

        async function start() {
            audioCtx = new AudioContext();
            const session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor'] });
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            document.getElementById('arBtn').style.display = 'none';
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
            
            mainGroup = new THREE.Group();
            const geo = new THREE.BoxGeometry(0.1, 0.3, 0.1);
            blockL = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: 0x00ff00}));
            blockR = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: 0x00ff00}));
            mainGroup.add(blockL, blockR);
            scene.add(mainGroup);

            xrRefSpace = await session.requestReferenceSpace('local');
            await renderer.xr.setSession(session);
            renderer.setAnimationLoop((t, frame) => {
                if (!frame) return;
                const pose = frame.getViewerPose(xrRefSpace);
                if (pose) {
                    const view = pose.views[0];
                    const m4 = new THREE.Matrix4().fromArray(view.transform.matrix);
                    const pos = new THREE.Vector3().setFromMatrixPosition(m4);
                    const quat = new THREE.Quaternion().setFromRotationMatrix(m4);
                    mainGroup.position.copy(pos).add(new THREE.Vector3(0, 0, -1.2).applyQuaternion(quat));
                    mainGroup.quaternion.copy(quat);
                }
                const val = Math.min(1.0, window.mD.low * 1.5);
                const x = 0.4 * (1.0 - val);
                blockL.position.x = -x;
                blockR.position.x = x;
                renderer.render(scene, camera);
            });
        }
        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
