<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V45 - VISUAL REVIVE</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #arBtn { 
            padding: 35px 60px; font-size: 24px; font-weight: bold;
            background: #00ff00; color: #000; border: none; border-radius: 60px; 
            cursor: pointer; box-shadow: 0 0 40px #0f0;
        }
    </style>
</head>
<body>
    <button id="arBtn">START AR V45</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, mainGroup;
        let patterns = [];
        window.mD = { low: 0, mid: 0, high: 0 };
        let currentIdx = 0, nextSwitch = 0, hue = 0;

        // 通信初期化
        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { document.getElementById('audio').srcObject = s; });
        });

        function setup() {
            const geoms = [
                new THREE.TorusKnotGeometry(0.6, 0.01, 150, 20),
                new THREE.OctahedronGeometry(1.2, 0),
                new THREE.TorusGeometry(0.8, 0.2, 3, 3),
                new THREE.BoxGeometry(2, 2, 0.02),
                new THREE.IcosahedronGeometry(0.6, 2),
                new THREE.CylinderGeometry(0.01, 0.01, 5, 8),
                new THREE.TorusGeometry(0.7, 0.2, 16, 100),
                new THREE.TetrahedronGeometry(0.5, 0),
                new THREE.TorusKnotGeometry(0.5, 0.1, 64, 8),
                new THREE.SphereGeometry(1.2, 16, 8)
            ];

            for(let i=0; i<10; i++) {
                const group = new THREE.Group();
                for(let j=0; j<25; j++) {
                    const m = new THREE.Mesh(geoms[i], new THREE.MeshBasicMaterial({ wireframe: true, transparent: true }));
                    m.position.set((Math.random()-0.5)*4.5, (Math.random()-0.5)*4.5, (Math.random()-0.5)*4.5);
                    group.add(m);
                }
                group.visible = false;
                patterns.push(group);
                mainGroup.add(group);
            }
            patterns[0].visible = true;
        }

        async function start() {
            try {
                // セッション要求
                const session = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['local'] // V44で成功した設定に準拠
                });

                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.xr.enabled = true;
                await renderer.xr.setSession(session);
                
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                // 背景を完全に透明に設定
                scene.background = null; 
                
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                mainGroup = new THREE.Group();
                scene.add(mainGroup);
                setup();

                document.getElementById('audio').play().catch(()=>{});

                renderer.setAnimationLoop((t, frame) => {
                    if (!frame) return;
                    hue += 0.005;
                    if (Date.now() > nextSwitch) {
                        patterns[currentIdx].visible = false;
                        currentIdx = (currentIdx + 1) % 10;
                        patterns[currentIdx].visible = true;
                        nextSwitch = Date.now() + 6000;
                    }

                    const d = window.mD;
                    // 頭の位置を取得して追従
                    const target = new THREE.Vector3(0, 0, -2).applyQuaternion(camera.quaternion).add(camera.position);
                    mainGroup.position.lerp(target, 0.1);

                    patterns[currentIdx].children.forEach((p, i) => {
                        p.rotation.y += 0.01 + d.high;
                        p.scale.setScalar(0.7 + d.low * 2.5);
                        p.material.color.setHSL((hue + i/25)%1, 1, 0.5);
                        p.material.opacity = 0.4 + d.low * 0.6;
                    });
                    renderer.render(scene, camera);
                });
            } catch (e) {
                alert("START FAILED: " + e.message);
            }
        }

        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
