<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V9 - HYPER HYBRID</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 40px 60px; font-size: 28px; background: #000; color: #0ff; 
            border: 4px solid #0ff; border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 40px #0ff; z-index: 1000;
        }
    </style>
</head>
<body>
    <button id="arBtn">START HYBRID VJ</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace, mainGroup, parts = [];
        window.mD = { low: 0, mid: 0, high: 0, trigger: false };
        let nextAutoSwitch = 0, hue = 0;
        const audioElem = document.getElementById('audio');

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { audioElem.srcObject = s; });
        });

        function createPattern(index) {
            if (mainGroup) scene.remove(mainGroup);
            mainGroup = new THREE.Group();
            parts = [];
            const mode = index % 12;

            // 12パターンの構築
            for(let i=0; i<20; i++) {
                let geo;
                if (mode < 4) { // 1. 構造物
                    const geos = [new THREE.BoxGeometry(0.2,0.2,0.2), new THREE.TorusGeometry(0.3,0.1,8,20), new THREE.OctahedronGeometry(0.3), new THREE.CylinderGeometry(0.1,0.1,0.4,4)];
                    geo = geos[mode];
                } else if (mode < 8) { // 2. ワームホール
                    geo = new THREE.TorusGeometry(0.5 + i*0.1, 0.01, 8, 50);
                } else { // 3. サイケデリック
                    geo = (i%2===0) ? new THREE.SphereGeometry(0.05,8,8) : new THREE.IcosahedronGeometry(0.1,0);
                }

                const mat = new THREE.MeshBasicMaterial({ wireframe: true, transparent: true, blending: THREE.AdditiveBlending });
                const m = new THREE.Mesh(geo, mat);
                
                if (mode >= 4 && mode < 8) { // ワームホール用配置
                    m.position.z = -i * 0.5;
                } else {
                    m.rotation.set(Math.random()*7, Math.random()*7, Math.random()*7);
                }
                parts.push(m); mainGroup.add(m);
            }
            scene.add(mainGroup);
            nextAutoSwitch = Date.now() + (2000 + Math.random() * 3000);
        }

        async function startAR() {
            audioElem.play().catch(() => {});
            try {
                const session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor', 'hand-tracking'] });
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.xr.enabled = true;
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                createPattern(0);
                xrRefSpace = await session.requestReferenceSpace('local');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert(e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;
            const d = window.mD;
            hue += 0.005;

            if (Date.now() > nextAutoSwitch) createPattern(Math.floor(Math.random()*12));

            // 手の判定（コントローラー排除フィルタ）
            let activeHandPos = null;
            const sources = frame.session.inputSources;
            for (let s of sources) {
                if (s.hand) {
                    const joint = s.hand.get('middle-finger-metacarpal');
                    const pose = joint ? frame.getJointPose(joint, xrRefSpace) : null;
                    if (pose) {
                        const y = pose.transform.position.y;
                        // 床(y < 0.3)にあるものは無視し、カメラの高さに近いものだけ採用
                        if (y > 0.4) {
                            activeHandPos = new THREE.Vector3(pose.transform.position.x, y, pose.transform.position.z);
                            break;
                        }
                    }
                }
            }

            const headFront = new THREE.Vector3(0, 0, -0.6).applyQuaternion(camera.quaternion).add(camera.position);
            mainGroup.position.lerp(activeHandPos || headFront, 0.15);

            parts.forEach((p, i) => {
                const mode = (Math.floor(nextAutoSwitch/1000) % 12); // 現在のモード
                
                p.rotation.y += (0.02 + d.high * 4);
                
                // スケール制御：目の前で留まるように最大値を制限
                let baseScale = 0.3 + d.low * 1.5; 
                if (mode >= 4 && mode < 8) { // ワームホールモード
                    p.position.z += 0.05 + d.low * 0.2;
                    if(p.position.z > 1) p.position.z = -8;
                    baseScale = 1.0;
                }
                p.scale.setScalar(baseScale);

                const c = new THREE.Color();
                c.setHSL((hue + i/20) % 1, 1, 0.5);
                p.material.color = c;
                p.material.opacity = 0.3 + d.low * 0.7;
            });

            renderer.render(scene, camera);
        }
        document.getElementById('arBtn').onclick = startAR;
    </script>
</body>
</html>
