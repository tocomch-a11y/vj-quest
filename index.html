<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V60 - LATENCY CALIBRATOR</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 30px; font-size: 20px; font-weight: bold;
            background: #fff; color: #000; border: none; border-radius: 10px; cursor: pointer; z-index: 1000;
        }
        #info {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; text-align: center;
        }
    </style>
</head>
<body>
    <button id="arBtn">START CALIBRATION V60</button>
    <div id="info">時報の「ピッ」で円がフラッシュし、<br>「ポーン」で色が大きく変わるように調整してください。</div>
    <audio id="remoteAudio" autoplay playsinline muted></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace, mainGroup;
        let audioCtx, delayNode, streamSource;
        let remoteStream = null;
        let calibratorMesh, needleMesh;
        window.mD = { low:0, mid:0, high:0, rms:0, beat:0 };

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => {
            c.on('data', d => { if(d) for(let k in window.mD) window.mD[k]=d[k]; });
        });

        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { 
                remoteStream = s;
                document.getElementById('remoteAudio').srcObject = s;
                if (audioCtx) connectStream(s);
            });
        });

        function connectStream(stream) {
            if (streamSource) streamSource.disconnect();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            streamSource = audioCtx.createMediaStreamSource(stream);
            if (!delayNode) {
                delayNode = audioCtx.createDelay(1.0);
                // --- ここを書き換えて調整してください ---
                delayNode.delayTime.value = 0.25; 
                // ------------------------------------
                delayNode.connect(audioCtx.destination);
            }
            streamSource.connect(delayNode);
        }

        function setup() {
            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            // 1. 中央のリング（音量で光る）
            const ringGeo = new THREE.TorusGeometry(0.5, 0.05, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            calibratorMesh = new THREE.Mesh(ringGeo, ringMat);
            mainGroup.add(calibratorMesh);

            // 2. 針（ビートでカクカク動く）
            const needleGeo = new THREE.BoxGeometry(0.02, 0.4, 0.02);
            needleGeo.translate(0, 0.2, 0);
            const needleMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            needleMesh = new THREE.Mesh(needleGeo, needleMat);
            mainGroup.add(needleMesh);
        }

        async function start() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor'] });
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.xr.enabled = true; renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                setup();
                if (remoteStream) connectStream(remoteStream);
                xrRefSpace = await session.requestReferenceSpace('local');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert(e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;
            const d = window.mD;

            // ターゲット位置をカメラの正面に固定
            _v.set(0, 0, -1.5).applyQuaternion(camera.quaternion).add(camera.position);
            mainGroup.position.lerp(_v, 0.2);
            mainGroup.lookAt(camera.position);

            // ビジュアル反応
            // 1. 音量(RMS)でリングの明るさと太さを変える
            const s = 1.0 + d.rms * 3.0;
            calibratorMesh.scale.set(s, s, 1);
            calibratorMesh.material.color.setHSL(0, 0, Math.min(1, d.rms * 5));

            // 2. ビート(beat)または低域(low)の瞬間に針をカクっと進める
            // 時報の「ピッ」というアタックに反応して角度が変わる
            if (d.beat > 0.5 || d.low > 0.5) {
                needleMesh.rotation.z -= 0.2; // 叩くたびに少し回る
                needleMesh.material.color.setHex(0xff0000); // 鳴った瞬間赤く
            } else {
                needleMesh.material.color.lerp(new THREE.Color(0x00ff00), 0.1);
            }

            renderer.render(scene, camera);
        }
        const _v = new THREE.Vector3();
        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
