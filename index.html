<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V36 - RESET & BOOT</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        #btn { padding: 40px; font-size: 24px; font-weight: bold; background: #0f0; border: none; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <button id="btn">FORCE RESET & START AR</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrSession, mainGroup;
        let patterns = [];
        window.mD = { low: 0, mid: 0, high: 0 };
        let currentIdx = 0, hue = 0, nextSwitch = 0;

        function setup() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            const geoms = [
                new THREE.TorusKnotGeometry(0.5, 0.01, 150, 20),
                new THREE.BoxGeometry(0.01, 0.01, 5),
                new THREE.PlaneGeometry(2, 2, 12, 12),
                new THREE.IcosahedronGeometry(0.5, 0),
                new THREE.TorusGeometry(0.7, 0.1, 10, 40)
            ];

            for(let i=0; i<5; i++) {
                const g = new THREE.Group();
                for(let j=0; j<25; j++) {
                    const m = new THREE.Mesh(geoms[i], new THREE.MeshBasicMaterial({ wireframe: true }));
                    m.position.set((Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*4);
                    g.add(m);
                }
                g.visible = false;
                patterns.push(g);
                mainGroup.add(g);
            }
            patterns[0].visible = true;
        }

        async function start() {
            // 1. もし古いセッションがあれば終了を試みる（これが重要）
            if (navigator.xr && xrSession) {
                try { await xrSession.end(); } catch(e) {}
            }

            try {
                // 2. セッションリクエスト
                xrSession = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['local']
                });

                // 3. 成功したら即座にレンダラー作成
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
                renderer.xr.enabled = true;
                await renderer.xr.setSession(xrSession);
                document.body.appendChild(renderer.domElement);
                document.getElementById('btn').style.display = 'none';

                setup();
                
                // 4. ARが安定した後にネットワークと音を解禁
                initNetwork();

                renderer.setAnimationLoop((t, frame) => {
                    if (!frame) return;
                    hue += 0.005;
                    if (Date.now() > nextSwitch) {
                        patterns[currentIdx].visible = false;
                        currentIdx = (currentIdx + 1) % 5;
                        patterns[currentIdx].visible = true;
                        nextSwitch = Date.now() + 6000;
                    }
                    const d = window.mD;
                    const target = new THREE.Vector3(0, 0, -2).applyQuaternion(camera.quaternion).add(camera.position);
                    mainGroup.position.lerp(target, 0.1);

                    patterns[currentIdx].children.forEach((p, i) => {
                        p.rotation.y += 0.01 + d.high;
                        p.scale.setScalar(0.7 + d.low * 2);
                        p.material.color.setHSL((hue + i/25)%1, 1, 0.5);
                    });
                    renderer.render(scene, camera);
                });

            } catch (e) {
                alert("Launch Error: " + e.message + "\nTry closing all tabs.");
            }
        }

        function initNetwork() {
            const peer = new Peer('quest-receiver');
            peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
            peer.on('call', call => {
                call.answer(new MediaStream());
                call.on('stream', s => { 
                    const audio = document.getElementById('audio');
                    audio.srcObject = s;
                    audio.play().catch(()=>{});
                });
            });
        }

        document.getElementById('btn').onclick = start;
    </script>
</body>
</html>
