<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V38 - FRACTAL NEBULA</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #arBtn { padding: 30px 50px; font-size: 20px; background: #fff; border-radius: 40px; cursor: pointer; border: none; font-weight: bold; z-index: 1000; }
    </style>
</head>
<body>
    <button id="arBtn">START FRACTAL SESSION</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, mainGroup, xrSession;
        let patterns = [];
        window.mD = { low: 0, mid: 0, high: 0 };
        let currentIdx = 0, nextSwitch = 0, hue = 0;

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { document.getElementById('audio').srcObject = s; });
        });

        function setup() {
            const geoms = [
                new THREE.DodecahedronGeometry(0.5, 0),    // 0: 高純度プラトンの立体
                new THREE.TorusGeometry(0.8, 0.005, 8, 100), // 1: 虚無の光輪（極細）
                new THREE.CapsuleGeometry(0.1, 0.8, 2, 8),  // 2: フローティング・カプセル
                new THREE.IcosahedronGeometry(0.6, 1),      // 3: データの胞子
                new THREE.TorusKnotGeometry(0.4, 0.15, 32, 2, 3, 4), // 4: 幾何学の心臓
                new THREE.CylinderGeometry(0.02, 0.02, 3, 4), // 5: 空間の杭（ピラー）
                new THREE.OctahedronGeometry(0.4, 5),       // 6: フラクタル・オーブ
                new THREE.RingGeometry(0.5, 0.9, 3),        // 7: デルタ・ゲート
                new THREE.TorusGeometry(0.5, 0.2, 3, 20),    // 8: 三角チューブの連鎖
                new THREE.BoxGeometry(1.5, 0.01, 1.5)       // 9: 次元の断層（フラット）
            ];

            for(let i=0; i<10; i++) {
                const group = new THREE.Group();
                let count = (i === 5 || i === 9) ? 40 : 25;
                for(let j=0; j<count; j++) {
                    const m = new THREE.Mesh(geoms[i], new THREE.MeshBasicMaterial({ wireframe: true, transparent: true }));
                    m.position.set((Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*4);
                    m.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                    group.add(m);
                }
                group.visible = false;
                patterns.push(group);
                mainGroup.add(group);
            }
            patterns[0].visible = true;
        }

        async function start() {
            try {
                xrSession = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['local'] });
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
                renderer.xr.enabled = true;
                await renderer.xr.setSession(xrSession);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                mainGroup = new THREE.Group();
                scene.add(mainGroup);
                setup();

                document.getElementById('audio').play().catch(()=>{});

                renderer.setAnimationLoop((t, frame) => {
                    if (!frame) return;
                    hue += 0.005;
                    if (Date.now() > nextSwitch) {
                        patterns[currentIdx].visible = false;
                        currentIdx = (currentIdx + 1) % 10;
                        patterns[currentIdx].visible = true;
                        nextSwitch = Date.now() + 6000;
                    }

                    const d = window.mD;
                    const target = new THREE.Vector3(0, 0, -1.8).applyQuaternion(camera.quaternion).add(camera.position);
                    mainGroup.position.lerp(target, 0.1);

                    patterns[currentIdx].children.forEach((p, i) => {
                        p.rotation.y += 0.01 + d.high * 0.5;
                        p.scale.setScalar(0.6 + d.low * 2.2);
                        p.material.color.setHSL((hue + i/25)%1, 1, 0.5);
                        p.material.opacity = 0.2 + d.low * 0.8;

                        if(currentIdx === 5) p.rotation.x += 0.1 * d.mid; // 杭の高速回転
                        if(currentIdx === 9) p.position.y += Math.sin(t/500 + i) * 0.005; // 断層の揺らぎ
                    });
                    renderer.render(scene, camera);
                });
            } catch (e) { alert(e.message); }
        }
        document.getElementById('arBtn').onclick = start;
    </script>
</body>
</html>
