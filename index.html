<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V8 - HYPER DRIVE</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 40px 60px; font-size: 28px; background: #000; color: #ff0055; 
            border: 4px solid #ff0055; border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 30px #ff0055; z-index: 1000;
        }
    </style>
</head>
<body>
    <button id="arBtn">START HYPER SESSION</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace, mainGroup, parts = [];
        window.mD = { low: 0, mid: 0, high: 0, trigger: false };
        let lastSwitch = 0, nextAutoSwitch = 0, hue = 0;
        const audioElem = document.getElementById('audio');

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { audioElem.srcObject = s; });
        });

        // 12種類の幾何学バリエーション
        function createPattern(index) {
            if (mainGroup) scene.remove(mainGroup);
            mainGroup = new THREE.Group();
            parts = [];
            const mode = index % 12;

            const geoMap = [
                new THREE.TorusKnotGeometry(0.3, 0.1, 100, 16),
                new THREE.IcosahedronGeometry(0.4, 0),
                new THREE.OctahedronGeometry(0.4, 0),
                new THREE.TetrahedronGeometry(0.4, 0),
                new THREE.DodecahedronGeometry(0.4, 0),
                new THREE.TorusGeometry(0.3, 0.15, 16, 100),
                new THREE.BoxGeometry(0.5, 0.5, 0.5),
                new THREE.CylinderGeometry(0.1, 0.4, 0.6, 32),
                new THREE.ConeGeometry(0.4, 0.7, 4),
                new THREE.SphereGeometry(0.4, 8, 8),
                new THREE.RingGeometry(0.2, 0.5, 32),
                new THREE.TorusKnotGeometry(0.3, 0.05, 128, 8, 5, 2)
            ];

            for(let i=0; i<15; i++) {
                const mat = new THREE.MeshBasicMaterial({ 
                    wireframe: true, 
                    transparent: true, 
                    blending: THREE.AdditiveBlending 
                });
                const m = new THREE.Mesh(geoMap[mode], mat);
                m.rotation.set(Math.random()*7, Math.random()*7, Math.random()*7);
                // 配置にランダム性を持たせる
                m.position.set((Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2);
                parts.push(m);
                mainGroup.add(m);
            }
            scene.add(mainGroup);
            // 切り替え時間を2~5秒に短縮
            nextAutoSwitch = Date.now() + (2000 + Math.random() * 3000);
        }

        async function startAR() {
            audioElem.play().catch(() => {});
            try {
                const session = await navigator.xr.requestSession('immersive-ar', {
                    optionalFeatures: ['local-floor', 'hand-tracking']
                });
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.xr.enabled = true;
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                
                createPattern(0);
                xrRefSpace = await session.requestReferenceSpace('local');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert(e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;
            const d = window.mD;
            hue += 0.004;

            if (Date.now() > nextAutoSwitch) {
                createPattern(Math.floor(Math.random() * 12));
            }

            // 【超重要】ハンドトラッキングの厳密な判定
            let activeHandPos = null;
            const sources = frame.session.inputSources;
            
            // 左右どちらの手でも、最初に見つかった「有効な手」を採用する
            for (let s of sources) {
                // コントローラーではなく、Hand Jointsを持っているか厳密にチェック
                if (s.hand) { 
                    const joint = s.hand.get('middle-finger-metacarpal'); // 手の平中央に近い関節
                    const pose = joint ? frame.getJointPose(joint, xrRefSpace) : null;
                    if (pose) {
                        activeHandPos = new THREE.Vector3(
                            pose.transform.position.x, 
                            pose.transform.position.y, 
                            pose.transform.position.z
                        );
                        break; // 片手が見つかればOK
                    }
                }
            }

            const headFront = new THREE.Vector3(0, 0, -0.6).applyQuaternion(camera.quaternion).add(camera.position);
            
            // 位置の更新（手の位置があればそこへ、なければ正面へ）
            if (activeHandPos) {
                mainGroup.position.lerp(activeHandPos, 0.2);
            } else {
                mainGroup.position.lerp(headFront, 0.1);
            }

            // パーツVJ演出
            parts.forEach((p, i) => {
                p.rotation.y += (0.02 + d.high * 4);
                p.rotation.z += (0.01 + d.mid * 2);
                
                const s = (0.3 + d.low * 9) * (1 + Math.sin(time*0.003 + i) * 0.4);
                p.scale.setScalar(s);

                const c = new THREE.Color();
                c.setHSL((hue + i/parts.length) % 1, 1, 0.5);
                p.material.color = c;
                p.material.opacity = 0.3 + d.low * 0.7;
            });

            renderer.render(scene, camera);
        }
        document.getElementById('arBtn').onclick = startAR;
    </script>
</body>
</html>
