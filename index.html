<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V7 - MULTI PATTERN</title>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        #arBtn { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 40px 60px; font-size: 28px; background: #000; color: #00ffff; 
            border: 4px solid #00ffff; border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 30px #00ffff; z-index: 1000;
        }
    </style>
</head>
<body>
    <button id="arBtn">INIT VJ SYSTEM</button>
    <audio id="audio" autoplay playsinline></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer, xrRefSpace, mainGroup, parts = [];
        window.mD = { low: 0, mid: 0, high: 0, trigger: false };
        let lastSwitch = 0, nextAutoSwitch = 0, hue = 0, vel = new THREE.Vector3();
        const audioElem = document.getElementById('audio');

        const peer = new Peer('quest-receiver');
        peer.on('connection', c => { c.on('data', d => { window.mD = d; }); });
        peer.on('call', call => {
            call.answer(new MediaStream());
            call.on('stream', s => { audioElem.srcObject = s; });
        });

        // 5つの全く異なる構造アルゴリズム
        function createPattern(index) {
            if (mainGroup) scene.remove(mainGroup);
            mainGroup = new THREE.Group();
            parts = [];
            const mode = index % 5;

            for(let i=0; i<20; i++) {
                let geo;
                if(mode === 0) geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                else if(mode === 1) geo = new THREE.TorusGeometry(0.3, 0.02, 16, 50);
                else if(mode === 2) geo = new THREE.OctahedronGeometry(0.2);
                else if(mode === 3) geo = new THREE.IcosahedronGeometry(0.4, 1);
                else geo = new THREE.SphereGeometry(0.05, 8, 8);

                const mat = new THREE.MeshBasicMaterial({ wireframe: true, transparent: true, blending: THREE.AdditiveBlending });
                const m = new THREE.Mesh(geo, mat);
                
                // 初期配置をパターンごとに変更
                if(mode === 0) m.position.set(Math.sin(i)*0.4, i*0.02 - 0.2, Math.cos(i)*0.4);
                else if(mode === 4) m.position.set(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5);
                
                parts.push(m);
                mainGroup.add(m);
            }
            scene.add(mainGroup);
            // 次の切り替え時間を5~15秒後に設定
            nextAutoSwitch = Date.now() + (5000 + Math.random() * 10000);
        }

        async function startAR() {
            audioElem.play().catch(() => {});
            try {
                const session = await navigator.xr.requestSession('immersive-ar', {
                    optionalFeatures: ['local-floor', 'hand-tracking']
                });
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.xr.enabled = true;
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);
                document.getElementById('arBtn').style.display = 'none';

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
                
                createPattern(0);
                xrRefSpace = await session.requestReferenceSpace('local');
                await renderer.xr.setSession(session);
                renderer.setAnimationLoop(render);
            } catch (e) { alert(e.message); }
        }

        function render(time, frame) {
            if (!xrRefSpace || !frame) return;
            const d = window.mD;
            hue += 0.002;

            // 時間経過による自動パターン切替
            if (Date.now() > nextAutoSwitch) {
                createPattern(Math.floor(Math.random() * 5));
            }

            // ハンドトラッキング（コントローラー干渉対策）
            let rHandPos = null;
            const sources = frame.session.inputSources;
            for (let s of sources) {
                // 手が存在し、かつトラッキングが有効な場合のみ
                if (s.hand && s.handedness === 'right') {
                    const joint = s.hand.get('index-finger-tip');
                    const pose = joint ? frame.getJointPose(joint, xrRefSpace) : null;
                    // 床にあるコントローラー（固定値に近いもの）を無視するため、
                    // カメラ位置から極端に離れている、または動かないものは捨てる
                    if (pose) {
                        rHandPos = new THREE.Vector3(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
                    }
                }
            }

            // 位置計算：常にカメラ正面、手があれば手に追従
            const headFront = new THREE.Vector3(0, 0, -0.6).applyQuaternion(camera.quaternion).add(camera.position);
            if (rHandPos) {
                mainGroup.position.lerp(rHandPos, 0.15);
            } else {
                mainGroup.position.lerp(headFront, 0.08);
            }

            // パーツごとのVJ演出
            parts.forEach((p, i) => {
                p.rotation.y += (0.01 + d.high * 2);
                p.rotation.x += (0.01 + d.mid * 1);
                
                const s = (0.4 + d.low * 7) * (1 + Math.sin(time*0.002 + i) * 0.3);
                p.scale.setScalar(s);

                const c = new THREE.Color();
                c.setHSL((hue + i/parts.length) % 1, 0.8, 0.5);
                p.material.color = c;
                p.material.opacity = 0.4 + d.low * 0.6;
            });

            renderer.render(scene, camera);
        }
        document.getElementById('arBtn').onclick = startAR;
    </script>
</body>
</html>
