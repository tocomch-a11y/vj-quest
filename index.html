<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PSY-AR V44 - BARE METAL</title>
    <style>
        body { margin: 0; background: #111; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        #arBtn { 
            padding: 50px; font-size: 30px; font-weight: bold;
            background: #ff0000; color: #fff; border: none; border-radius: 100px; 
            cursor: pointer; box-shadow: 0 0 50px #ff0000;
        }
    </style>
</head>
<body>
    <button id="arBtn">FINAL TEST: START</button>

    <script>
        const btn = document.getElementById('arBtn');

        async function startTest() {
            if (!navigator.xr) {
                alert("WebXR未対応です");
                return;
            }

            try {
                // 1. 最も原始的な方法でセッションを要求
                const session = await navigator.xr.requestSession('immersive-ar');
                
                // 2. 空間リクエスト（ここがエラーの源。失敗しても無視するように設計）
                let refSpace;
                try {
                    // 何も指定せず、ブラウザに選ばせる
                    refSpace = await session.requestReferenceSpace('viewer');
                } catch(e) {
                    console.log("viewer space failed, trying local...");
                    try {
                        refSpace = await session.requestReferenceSpace('local');
                    } catch(e2) {
                        alert("空間取得に全失敗: " + e2.message);
                    }
                }

                // 3. 画面の更新（これが動けば勝ち）
                session.requestAnimationFrame(function onFrame(t, frame) {
                    // ここでARモードが維持されていれば、パススルー映像が見えるはずです
                    session.requestAnimationFrame(onFrame);
                });

                btn.style.display = 'none';
                alert("セッション開始成功！パススルーが見えていますか？");

            } catch (err) {
                alert("セッション開始失敗: " + err.message);
            }
        }

        btn.onclick = startTest;
    </script>
</body>
</html>
