<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>SENDER V71</title></head>
<body style="font-family:sans-serif; padding:20px;">
    <h2>SENDER V71 (Audio Streamer)</h2>
    <button id="btn" style="padding:20px; background:#4CAF50; color:white;">START STREAMING</button>
    <div id="status" style="margin-top:20px;">STATUS: IDLE</div>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer('pc-sender');
        document.getElementById('btn').onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            peer.call('quest-receiver', stream);
            document.getElementById('status').innerText = "STREAMING TO QUEST...";
        };
    </script>
</body>
</html>
