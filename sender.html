<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>SENDER V78 - LATENCY TEST</title></head>
<body style="font-family:sans-serif; padding:20px;">
    <h2>SENDER V78 (Latency Focus)</h2>
    <button id="start" style="padding:15px;">1. START AUDIO</button>
    <button id="connect" style="padding:15px;">2. CONNECT TO QUEST</button>
    <div id="debug" style="font-size:24px; font-family:monospace; margin-top:10px;">L: 0.00</div>

    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <script>
        let peer, conn, audioStream;
        const debug = document.getElementById('debug');

        document.getElementById('start').onclick = async () => {
            // ノイズ抑制などをすべてオフにし、生音を最優先
            audioStream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, latency: 0 } 
            });
            const ctx = new AudioContext();
            const src = ctx.createMediaStreamSource(audioStream);
            const ana = ctx.createAnalyser();
            ana.fftSize = 256; // 解析を最速にする
            src.connect(ana);
            const data = new Uint8Array(ana.frequencyBinCount);

            // 通信の「詰まり」によるノイズを防ぐため、送信頻度を少し落としつつ安定化
            setInterval(() => {
                ana.getByteFrequencyData(data);
                const low = data.slice(0, 5).reduce((a, b) => a + b) / 600; 
                debug.innerText = `L: ${low.toFixed(2)}`;
                if (conn && conn.open) {
                    conn.send({ l: Number(low.toFixed(2)) }); // 数値を短くして送信
                }
            }, 20); // 50fps
        };

        document.getElementById('connect').onclick = () => {
            peer = new Peer('mac-sender-' + Math.floor(Math.random()*1000));
            peer.on('open', () => {
                conn = peer.connect('quest-receiver', { serialization: 'json', reliable: false });
                peer.call('quest-receiver', audioStream);
            });
        };
    </script>
</body>
</html>
