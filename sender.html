<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SENDER V68 - TAB AUDIO</title>
</head>
<body style="font-family:sans-serif; padding:20px; background:#f0f0f0;">
    <h2>SENDER V68 (Mac Tab Capture)</h2>
    <p>1. 接続ボタンを押し、Questを待機状態にします</p>
    <button id="btn1" style="padding:15px; width:200px;">1. CONNECT</button>
    
    <p>2. 音源のタブを共有し、解析を開始します</p>
    <button id="btn2" style="padding:15px; width:200px; background:#4CAF50; color:white;">2. CAPTURE TAB AUDIO</button>
    <p style="font-size:12px; color:red;">※共有時に「タブの音声も共有」を必ずONにしてください</p>

    <div id="status" style="margin-top:20px; font-weight:bold;">STATUS: IDLE</div>
    <div id="rmsDisplay" style="font-size:40px; font-family:monospace; margin-top:10px;">RMS: 0.000</div>

    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer('pc-sender');
        let conn, audioCtx, analyser, dataArray;

        document.getElementById('btn1').onclick = () => {
            conn = peer.connect('quest-receiver');
            conn.on('open', () => { document.getElementById('status').innerText = "STATUS: CONNECTED"; });
        };

        document.getElementById('btn2').onclick = async () => {
            try {
                // 画面/タブ共有で音声をキャプチャ
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: true
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                source.connect(analyser);
                // Sender側でも音が聞こえるように出力に繋ぐ
                analyser.connect(audioCtx.destination);

                // Questにストリームを送信（音が出るようにするため）
                peer.call('quest-receiver', stream);

                function loop() {
                    analyser.getByteTimeDomainData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        let v = (dataArray[i] - 128) / 128;
                        sum += v * v;
                    }
                    let rms = Math.sqrt(sum / dataArray.length);
                    document.getElementById('rmsDisplay').innerText = "RMS: " + rms.toFixed(3);
                    if (conn && conn.open) conn.send({ rms: rms });
                    requestAnimationFrame(loop);
                }
                loop();
            } catch (e) { alert("Capture failed: " + e); }
        };
    </script>
</body>
</html>
