<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SENDER - RMS FIX</title>
</head>
<body>
    <h2>SENDER (RMS FIX)</h2>
    <button id="startBtn" style="padding:20px; font-size:18px;">1. START & CONNECT</button>
    <div id="status" style="margin-top:20px; font-family:monospace; color:blue;">STATUS: IDLE</div>
    <div id="debug" style="margin-top:10px; font-size:24px; font-weight:bold;">RMS: 0.000</div>

    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer('pc-sender');
        let conn, audioCtx, analyser, dataArray;
        let isConnecting = false;

        async function startSystem() {
            try {
                // マイク・音声取得
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                document.getElementById('status').innerText = "STATUS: MIC OK. CONNECTING...";

                // Peer接続（受信側のID: quest-receiver）
                conn = peer.connect('quest-receiver');
                const call = peer.call('quest-receiver', stream);

                // --- 音声解析の構築 ---
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser); // マイク音を解析器に接続
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                conn.on('open', () => {
                    document.getElementById('status').innerText = "STATUS: CONNECTED!";
                    isConnecting = true;
                    requestAnimationFrame(sendData);
                });

            } catch (err) {
                alert("Error: " + err);
            }
        }

        function sendData() {
            if (!isConnecting) return;

            // RMS(音量)の計算
            analyser.getByteTimeDomainData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                let v = (dataArray[i] - 128) / 128;
                sum += v * v;
            }
            let rms = Math.sqrt(sum / dataArray.length);

            // デバッグ表示
            document.getElementById('debug').innerText = "RMS: " + rms.toFixed(3);

            // Quest側に送信
            if (conn.open) {
                conn.send({ rms: rms });
            }
            
            requestAnimationFrame(sendData);
        }

        document.getElementById('startBtn').onclick = startSystem;
    </script>
</body>
</html>
