<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SENDER - AUDIO</title>
</head>
<body>
    <button id="start">1. START AUDIO (VB-CABLE)</button>
    <button id="connect">2. CONNECT TO QUEST</button>
    <div id="status">Status: Idle</div>

    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <script>
        let peer, conn, audioStream;
        const status = document.getElementById('status');

        // 手順1: 音声をキャプチャ
        document.getElementById('start').onclick = async () => {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    } 
                });
                setupAudio(audioStream);
                status.innerText = "Audio captured. Now connect to Quest.";
            } catch (e) { status.innerText = "Mic Error: " + e.message; }
        };

        // 手順2: Questに接続
        document.getElementById('connect').onclick = () => {
            if (!peer) peer = new Peer('mac-sender-' + Math.floor(Math.random()*1000));
            
            peer.on('open', () => {
                conn = peer.connect('quest-receiver');
                peer.call('quest-receiver', audioStream);
                
                conn.on('open', () => {
                    status.innerText = "Connected! Transmitting...";
                });
                
                conn.on('error', (e) => {
                    status.innerText = "Connect Error: " + e.type;
                    console.log(e);
                });
            });
        };

        function setupAudio(stream) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const src = ctx.createMediaStreamSource(stream);
            const ana = ctx.createAnalyser();
            ana.fftSize = 256;
            src.connect(ana);
            const data = new Uint8Array(ana.frequencyBinCount);

            function loop() {
                ana.getByteFrequencyData(data);
                // 低・中・高域の感度調整
                const low = data.slice(0, 5).reduce((a, b) => a + b) / 1275;
                const mid = data.slice(5, 30).reduce((a, b) => a + b) / 6375;
                const high = data.slice(30, 100).reduce((a, b) => a + b) / 17850;
                
                if (conn && conn.open) {
                    conn.send({ low, mid, high, trigger: low > 0.7 });
                }
                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
