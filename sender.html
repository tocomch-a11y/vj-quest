<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>SENDER V73</title></head>
<body style="font-family:sans-serif; padding:20px;">
    <h2>SENDER V73</h2>
    <button id="btn1" style="padding:15px;">1. CONNECT TO QUEST</button>
    <button id="btn2" style="padding:15px; background:#4CAF50; color:white;">2. START AUDIO STREAM</button>
    <div id="status" style="margin-top:20px; font-weight:bold;">STATUS: IDLE</div>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer('pc-sender');
        document.getElementById('btn1').onclick = () => {
            const conn = peer.connect('quest-receiver');
            conn.on('open', () => { document.getElementById('status').innerText = "STATUS: CONNECTED"; });
        };
        document.getElementById('btn2').onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            peer.call('quest-receiver', stream);
            document.getElementById('status').innerText = "STATUS: STREAMING...";
        };
    </script>
</body>
</html>
