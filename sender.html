<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>SENDER - DATA FIX</title></head>
<body style="font-family:sans-serif; padding:20px;">
    <h2>SENDER (DATA FIX)</h2>
    <button id="start" style="padding:15px;">1. START AUDIO (VB-CABLE)</button>
    <button id="connect" style="padding:15px;">2. CONNECT TO QUEST</button>
    <div id="status" style="margin-top:10px; color:blue;">Status: Idle</div>
    <div id="debug" style="font-size:24px; font-family:monospace; margin-top:10px;">L: 0.00 | M: 0.00</div>

    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <script>
        let peer, conn, audioStream;
        const status = document.getElementById('status');
        const debug = document.getElementById('debug');

        document.getElementById('start').onclick = async () => {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });
                setupAudio(audioStream);
                status.innerText = "Audio captured. Ready to connect.";
            } catch (e) { status.innerText = "Mic Error: " + e.message; }
        };

        document.getElementById('connect').onclick = () => {
            if (!peer) peer = new Peer('mac-sender-' + Math.floor(Math.random()*1000));
            peer.on('open', () => {
                conn = peer.connect('quest-receiver');
                peer.call('quest-receiver', audioStream);
                conn.on('open', () => { status.innerText = "CONNECTED!"; });
            });
        };

        function setupAudio(stream) {
            const ctx = new AudioContext();
            const src = ctx.createMediaStreamSource(stream);
            const ana = ctx.createAnalyser();
            ana.fftSize = 256;
            src.connect(ana);
            const data = new Uint8Array(ana.frequencyBinCount);

            function loop() {
                ana.getByteFrequencyData(data);
                // 感度を上げて計算 (1275 -> 500程度に下げて反応しやすく)
                const low = data.slice(0, 5).reduce((a, b) => a + b) / 600; 
                const mid = data.slice(5, 30).reduce((a, b) => a + b) / 3000;
                
                debug.innerText = `L: ${low.toFixed(2)} | M: ${mid.toFixed(2)}`;
                
                if (conn && conn.open) {
                    conn.send({ low, mid, high: 0 });
                }
                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
